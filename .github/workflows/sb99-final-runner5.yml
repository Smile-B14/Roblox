name: SB99 final runner 5

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sb99-final-runner5.yml"

permissions:
  contents: write

jobs:
  final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Final Luau compile and guarded update
        shell: bash
        env:
          EXPECTED_BLOB: fad489d80b4297ae9d4fb0065360cc6391507d45
          TARGET: 99 Nights Helper Godmode
        run: |
          set -euo pipefail

          [[ "$(git hash-object "$TARGET")" == "$EXPECTED_BLOB" ]] || exit 42

          python3 <<'PY'
          from pathlib import Path
          import textwrap

          runner4 = Path(".github/workflows/sb99-final-runner4.yml").read_text(encoding="utf-8")
          marker = "          python3 <<'PY'\n"
          start = runner4.index(marker) + len(marker)
          end = runner4.index("\n          PY", start)
          source = textwrap.dedent(runner4[start:end])

          brittle = '''if text.count(direct_return) != 1:
              raise SystemExit("unexpected RETURN_POSITION PivotTo count")
          text = text.replace(direct_return, safe_return, 1)'''
          robust = '''return_count = text.count(direct_return)
          if return_count < 1:
              raise SystemExit("no RETURN_POSITION PivotTo found")
          text = text.replace(direct_return, safe_return)'''
          if brittle not in source:
              raise SystemExit("runner4 return-pivot guard anchor missing")
          source = source.replace(brittle, robust, 1)

          exec(compile(source, "<sb99-final-reviewed-patch>", "exec"), {})
          PY

          python3 <<'PY'
          from pathlib import Path
          import re

          s = Path("99 Nights Helper Godmode").read_text(encoding="utf-8")

          if re.search(r'WaitForChild\([^,\n\)]*\)', s):
              raise SystemExit("unbounded WaitForChild found")

          required = (
              "local G = _G",
              "local ok, env = pcall(getgenv)",
              "previousState.active = false",
              "previousState.autoFarm = false",
              "previousState.autoChop = false",
              "previousState.killAura = false",
              "previousState.autoBestGear = false",
              "previousState.emergencyFoodRun = false",
              "previousState.foodServiceRunning = false",
              "if previousWasFarming then\n    pcall(function()",
              "pcall(task.cancel, invokeThread)",
              "local dragBusy = false",
              "local function acquireDragLock",
              "local verifyDeadline = os.clock() + (remoteIsEvent and 0.5 or 0.2)",
              "local function requestHotbarPickup",
              "local wrapClosure = type(newcclosure) == \"function\"",
              "pcall(checkcaller)",
              "pcall(task.cancel, attackThread)",
              "local function lockFarmCharacter",
              "local deadline = os.clock() + duration + 2",
              "pcall(character.PivotTo, character, CFrame.new(FARM_HOME))",
              "pcall(character.PivotTo, character, CFrame.new(RETURN_POSITION))",
              "local dragTouch = nil",
              "local ballTouch = nil",
              "local function runFoodService",
              "local function enableFarm",
              "local function disableFarm",
              "local function minimizeUI",
              "updateButtons()",
          )
          for needle in required:
              if needle not in s:
                  raise SystemExit(f"required final path missing: {needle}")

          if s.count("pcall(character.PivotTo, character, CFrame.new(FARM_HOME))") != 4:
              raise SystemExit("unexpected protected FARM_HOME count")
          if s.count("pcall(character.PivotTo, character, CFrame.new(RETURN_POSITION))") < 1:
              raise SystemExit("RETURN_POSITION is not protected")

          forbidden = (
              'local G = (type(getgenv) == "function" and getgenv()) or _G',
              'and type(newcclosure) == "function" then',
              'executorCall = checkcaller()',
              'character:PivotTo(CFrame.new(FARM_HOME))',
              'character:PivotTo(CFrame.new(RETURN_POSITION))',
          )
          for needle in forbidden:
              if needle in s:
                  raise SystemExit(f"legacy fragile path remains: {needle}")
          PY

          git diff --check -- "$TARGET"
          if git diff --quiet -- "$TARGET"; then
            echo "No meaningful target change"
            exit 46
          fi

          curl -fsSL https://api.github.com/repos/luau-lang/luau/releases/latest -o /tmp/luau-release.json
          luau_url="$(jq -r '.assets[] | select(.name == "luau-ubuntu.zip") | .browser_download_url' /tmp/luau-release.json | head -n1)"
          test -n "$luau_url"
          curl -fsSL "$luau_url" -o /tmp/luau.zip
          rm -rf /tmp/luau && mkdir -p /tmp/luau
          unzip -q /tmp/luau.zip -d /tmp/luau
          chmod +x /tmp/luau/luau-compile
          /tmp/luau/luau-compile "$TARGET" >/dev/null

          # Immediate pre-write refetch of the exact target blob.
          git fetch origin main
          remote_blob="$(git ls-tree origin/main -- "$TARGET" | awk '{print $3}')"
          [[ "$remote_blob" == "$EXPECTED_BLOB" ]] || { echo "Target changed before write: $remote_blob"; exit 43; }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$TARGET"
          git rm -- \
            .github/workflows/sb99-final-guarded.yml \
            .github/workflows/sb99-final-runner.yml \
            .github/workflows/sb99-final-runner2.yml \
            .github/workflows/sb99-final-runner3.yml \
            .github/workflows/sb99-final-runner4.yml \
            .github/workflows/sb99-final-runner5.yml
          git commit -m "fix: harden final executor runtime"

          git fetch origin main
          remote_blob="$(git ls-tree origin/main -- "$TARGET" | awk '{print $3}')"
          [[ "$remote_blob" == "$EXPECTED_BLOB" ]] || { echo "Target changed during validation: $remote_blob"; exit 44; }
          git rebase origin/main

          # Final refetch immediately before the non-force push.
          git fetch origin main
          remote_blob="$(git ls-tree origin/main -- "$TARGET" | awk '{print $3}')"
          [[ "$remote_blob" == "$EXPECTED_BLOB" ]] || { echo "Target changed before push: $remote_blob"; exit 45; }
          git push origin HEAD:main
