name: SB99 Utility Remote Hardening

on:
  push:
    paths:
      - '.github/workflows/sb99-nightly-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Harden utility remote timeout recovery
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          path = Path('99 Nights Helper Godmode')
          expected_blob = 'b20fb4346ae2713a91679093e80eda2455beacc8'
          actual_blob = subprocess.check_output(['git', 'hash-object', str(path)], text=True).strip()

          workflow = Path('.github/workflows/sb99-nightly-hotfix.yml')

          if actual_blob != expected_blob:
              print(f'Target changed before patch: expected {expected_blob}, got {actual_blob}. Leaving target untouched.')
              workflow.unlink(missing_ok=True)
              raise SystemExit(0)

          text = path.read_text(encoding='utf-8')

          old = '''-- Utility RemoteFunctions are isolated behind a timeout guard. Each call owns
          -- a tokenized expiring lock: a hung InvokeServer cannot freeze Auto Eat, gear
          -- pickup, or cooking forever, and a late old response cannot unlock a newer call.
          local invokeLocks = setmetatable({}, { __mode = "k" })
          local function callUtilityRemote(remote, timeoutSeconds, ...)
              if not isLive(remote) then
                  return false, nil
              end

              if remote:IsA("RemoteEvent") then
                  local ok = pcall(remote.FireServer, remote, ...)
                  return ok, ok and true or nil
              end

              if not remote:IsA("RemoteFunction") then
                  return false, nil
              end

              local timeout = math.max(0.25, tonumber(timeoutSeconds) or 2)
              local now = os.clock()
              local existing = invokeLocks[remote]
              if existing and existing.expiresAt > now then
                  return false, nil
              end

              local args = table.pack(...)
              local token = {}
              local done = false
              local ok = false
              local result = nil

              invokeLocks[remote] = {
                  token = token,
                  expiresAt = now + timeout + 0.75,
              }

              task.spawn(function()
                  ok, result = pcall(remote.InvokeServer, remote, table.unpack(args, 1, args.n))
                  done = true

                  local activeLock = invokeLocks[remote]
                  if activeLock and activeLock.token == token then
                      invokeLocks[remote] = nil
                  end
              end)

              local deadline = now + timeout
              while state.active and not done and os.clock() < deadline do
                  task.wait()
              end

              if not done then
                  return false, nil
              end

              return ok, result
          end'''

          new = '''-- Utility RemoteFunctions are isolated behind a timeout guard. Each call owns
          -- a tokenized expiring lock. A timed-out InvokeServer also enters a short
          -- circuit-breaker cooldown so a permanently hung server remote cannot leak a
          -- new waiting coroutine every couple of seconds. Late responses only clear
          -- the cooldown that belongs to their own token, so newer calls stay isolated.
          local invokeLocks = setmetatable({}, { __mode = "k" })
          local invokeCooldowns = setmetatable({}, { __mode = "k" })

          local function callUtilityRemote(remote, timeoutSeconds, ...)
              if not isLive(remote) then
                  return false, nil
              end

              if remote:IsA("RemoteEvent") then
                  local ok = pcall(remote.FireServer, remote, ...)
                  return ok, ok and true or nil
              end

              if not remote:IsA("RemoteFunction") then
                  return false, nil
              end

              local timeout = math.max(0.25, tonumber(timeoutSeconds) or 2)
              local now = os.clock()

              local cooldown = invokeCooldowns[remote]
              if cooldown then
                  if cooldown.untilAt > now then
                      return false, nil
                  end
                  invokeCooldowns[remote] = nil
              end

              local existing = invokeLocks[remote]
              if existing and existing.expiresAt > now then
                  return false, nil
              end

              local args = table.pack(...)
              local token = {}
              local done = false
              local ok = false
              local result = nil

              invokeLocks[remote] = {
                  token = token,
                  expiresAt = now + timeout + 0.75,
              }

              task.spawn(function()
                  ok, result = pcall(remote.InvokeServer, remote, table.unpack(args, 1, args.n))
                  done = true

                  local activeLock = invokeLocks[remote]
                  if activeLock and activeLock.token == token then
                      invokeLocks[remote] = nil
                  end

                  local activeCooldown = invokeCooldowns[remote]
                  if activeCooldown and activeCooldown.token == token then
                      invokeCooldowns[remote] = nil
                  end
              end)

              local deadline = now + timeout
              while state.active and not done and os.clock() < deadline do
                  task.wait()
              end

              if not done then
                  invokeCooldowns[remote] = {
                      token = token,
                      untilAt = os.clock() + 8,
                  }
                  return false, nil
              end

              return ok, result
          end'''

          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one utility remote block, found {text.count(old)}')

          patched = text.replace(old, new, 1)

          # Conservative static sanity checks. These are not a substitute for live
          # Roblox testing, but they catch accidental truncation and delimiter damage.
          if len(patched) < 30000:
              raise SystemExit('Patched script unexpectedly short')
          for required in (
              'Smile B - 99 Nights Helper',
              'local function callUtilityRemote',
              'local function attemptAutoEat',
              'local function attackTarget',
              'local function enableFarm',
              'local function disableFarm',
              'updateButtons()',
          ):
              if required not in patched:
                  raise SystemExit(f'Missing required section: {required}')

          # Every WaitForChild in this helper should remain bounded by a timeout.
          import re
          unbounded = []
          for match in re.finditer(r':WaitForChild\(([^\n\)]*)\)', patched):
              if ',' not in match.group(1):
                  unbounded.append(match.group(0))
          if unbounded:
              raise SystemExit(f'Unbounded WaitForChild found: {unbounded[:3]}')

          path.write_text(patched, encoding='utf-8')
          workflow.unlink(missing_ok=True)
          PY

      - name: Commit guarded improvement
        shell: bash
        run: |
          git config user.name "Smile B Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          if git diff --cached -- '99 Nights Helper Godmode' | grep -q 'invokeCooldowns'; then
            git commit -m "fix: throttle hung utility remote retries"
          else
            git commit -m "chore: remove stale SB99 patch workflow"
          fi
          git push origin HEAD:main
