name: SB99 Remote Guard Patch

on:
  push:
    paths:
      - '.github/workflows/sb99-polish.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Harden utility RemoteFunction single-flight behavior
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import re

          path = Path('99 Nights Helper Godmode')
          workflow = Path('.github/workflows/sb99-polish.yml')
          expected_blob = 'fad489d80b4297ae9d4fb0065360cc6391507d45'
          actual_blob = subprocess.check_output(['git', 'hash-object', str(path)], text=True).strip()

          if actual_blob != expected_blob:
              print(f'Target changed before patch: expected {expected_blob}, got {actual_blob}. Leaving target untouched.')
              workflow.unlink(missing_ok=True)
              raise SystemExit(0)

          text = path.read_text(encoding='utf-8')
          start_marker = 'local invokeLocks = setmetatable({}, { __mode = "k" })'
          end_marker = '-- No Hunger spoof in the final build.'
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit('Utility remote section markers changed; refusing unsafe patch')

          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = '''local invokeLocks = setmetatable({}, { __mode = "k" })

local function callUtilityRemote(remote, timeoutSeconds, ...)
    if not isLive(remote) then
        return false, nil
    end

    if remote:IsA("RemoteEvent") then
        local ok = pcall(remote.FireServer, remote, ...)
        return ok, ok and true or nil
    end

    if not remote:IsA("RemoteFunction") then
        return false, nil
    end

    -- Roblox/Luau cannot cancel a yielded InvokeServer. Keep exactly one
    -- in-flight invocation per RemoteFunction until that coroutine actually
    -- returns. A timeout only stops the caller from waiting; it does not start
    -- another invocation that could become another permanently stuck thread.
    -- If the game replaces the remote Instance, refreshRemotes naturally gives
    -- the replacement its own independent single-flight lock.
    if invokeLocks[remote] ~= nil then
        return false, nil
    end

    local timeout = math.max(0.25, tonumber(timeoutSeconds) or 2)
    local args = table.pack(...)
    local token = {}
    local done = false
    local ok = false
    local result = nil

    invokeLocks[remote] = token

    task.spawn(function()
        ok, result = pcall(remote.InvokeServer, remote, table.unpack(args, 1, args.n))
        done = true

        if invokeLocks[remote] == token then
            invokeLocks[remote] = nil
        end
    end)

    local deadline = os.clock() + timeout
    while state.active and not done and os.clock() < deadline do
        task.wait()
    end

    if not done then
        return false, nil
    end

    return ok, result
end

'''

          patched = text[:start] + replacement + text[end:]
          if patched == text:
              raise SystemExit('No target change produced')
          if 'invokeCooldowns' in patched or 'expiresAt' in patched:
              raise SystemExit('Old expiring invocation guard still present')

          required = (
              'Smile B - 99 Nights Helper',
              'local function attemptAutoEat()',
              'local function attackTarget(target, isTree)',
              'local function runFoodService()',
              'local function isNight()',
              'local function enableFarm()',
              'local function disableFarm()',
              'Godmode Active',
              'Credits: Smile B',
              'updateButtons()',
          )
          for marker in required:
              if marker not in patched:
                  raise SystemExit(f'Missing required section: {marker}')

          unbounded = []
          for match in re.finditer(r':WaitForChild\(([^\n\)]*)\)', patched):
              if ',' not in match.group(1):
                  unbounded.append(match.group(0))
          if unbounded:
              raise SystemExit(f'Unbounded WaitForChild found: {unbounded[:3]}')

          if len(patched) < 30000 or patched.count('local function ') < 20:
              raise SystemExit('Unexpected structural shrink detected')

          path.write_text(patched, encoding='utf-8')
          workflow.unlink(missing_ok=True)
          PY

      - name: Commit guarded improvement
        shell: bash
        run: |
          git config user.name "Smile B Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          changed="$(git diff --cached --name-only)"
          echo "$changed" | grep -Fx '99 Nights Helper Godmode'
          echo "$changed" | grep -Fx '.github/workflows/sb99-polish.yml'
          test "$(echo "$changed" | wc -l)" -eq 2
          git commit -m "fix: prevent hung remote coroutine buildup"
          git push origin HEAD:main
