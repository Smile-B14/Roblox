name: SB99 bed and night repair v3

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: sb99-bed-night-repair-v3
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Guard and patch
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BLOB="1fd5e63793b0ae7c9657a2aae7abe079f725e18a"
          ACTUAL_BLOB="$(git hash-object '99 Nights Helper Godmode')"
          test "$ACTUAL_BLOB" = "$EXPECTED_BLOB" || { echo "stale helper: $ACTUAL_BLOB" >&2; exit 20; }
          python3 .github/sb99-bed-night-repair.py
          git diff --check

      - name: Compile with official Luau
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/luau-lang/luau.git /tmp/luau
          cmake -S /tmp/luau -B /tmp/luau/build -DCMAKE_BUILD_TYPE=Release >/dev/null
          cmake --build /tmp/luau/build --target Luau.Compile.CLI -j2 >/dev/null
          /tmp/luau/build/luau-compile '99 Nights Helper Godmode' >/dev/null

      - name: Refetch and push guarded repair
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BLOB="1fd5e63793b0ae7c9657a2aae7abe079f725e18a"
          git fetch origin main
          REMOTE_BLOB="$(git rev-parse 'origin/main:99 Nights Helper Godmode')"
          test "$REMOTE_BLOB" = "$EXPECTED_BLOB" || { echo "newer helper exists: $REMOTE_BLOB" >&2; exit 21; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '99 Nights Helper Godmode'
          git commit -m 'fix: place beds and restore night shelter'
          git push origin HEAD:main
