name: SB99 final guarded update

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sb99-final-guarded.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch, validate, and commit
        shell: bash
        env:
          EXPECTED_BLOB: fad489d80b4297ae9d4fb0065360cc6391507d45
          TARGET: 99 Nights Helper Godmode
          WORKFLOW: .github/workflows/sb99-final-guarded.yml
        run: |
          set -euo pipefail

          current_blob="$(git hash-object "$TARGET")"
          if [[ "$current_blob" != "$EXPECTED_BLOB" ]]; then
            echo "Target changed before patch: $current_blob"
            exit 42
          fi

          python3 <<'PY'
          from pathlib import Path

          path = Path("99 Nights Helper Godmode")
          text = path.read_text(encoding="utf-8")

          def rep(old, new, count=1):
              global text
              found = text.count(old)
              if found < count:
                  raise SystemExit(f"patch anchor missing: wanted {count}, found {found}: {old[:100]!r}")
              text = text.replace(old, new, count)

          rep('local G = (type(getgenv) == "function" and getgenv()) or _G', '''local G = _G
          if type(getgenv) == "function" then
              local ok, env = pcall(getgenv)
              if ok and type(env) == "table" then
                  G = env
              end
          end
          if type(G) ~= "table" then
              G = {}
          end''')

          rep('''if type(previousState) == "table" then
              previousState.active = false
          end''', '''if type(previousState) == "table" then
              previousState.active = false
              previousState.autoFarm = false
              previousState.autoChop = false
              previousState.killAura = false
              previousState.autoBestGear = false
              previousState.emergencyFoodRun = false
              previousState.foodServiceRunning = false
          end''')

          rep('''    task.spawn(function()
                  ok, result = pcall(remote.InvokeServer, remote, table.unpack(args, 1, args.n))
                  done = true

                  local activeLock = invokeLocks[remote]
                  if activeLock and activeLock.token == token then
                      invokeLocks[remote] = nil
                  end

                  local activeCooldown = invokeCooldowns[remote]
                  if activeCooldown and activeCooldown.token == token then
                      invokeCooldowns[remote] = nil
                  end
              end)

              local deadline = now + timeout
              while state.active and not done and os.clock() < deadline do
                  task.wait()
              end

              if not done then
                  invokeCooldowns[remote] = {
                      token = token,
                      untilAt = os.clock() + 8,
                  }
                  return false, nil
              end''', '''    local invokeThread
              invokeThread = task.spawn(function()
                  ok, result = pcall(remote.InvokeServer, remote, table.unpack(args, 1, args.n))
                  done = true

                  local activeLock = invokeLocks[remote]
                  if activeLock and activeLock.token == token then
                      invokeLocks[remote] = nil
                  end

                  local activeCooldown = invokeCooldowns[remote]
                  if activeCooldown and activeCooldown.token == token then
                      invokeCooldowns[remote] = nil
                  end
              end)

              local deadline = now + timeout
              while state.active and not done and os.clock() < deadline do
                  task.wait()
              end

              if not done then
                  if type(task.cancel) == "function" and invokeThread then
                      pcall(task.cancel, invokeThread)
                  end

                  local activeLock = invokeLocks[remote]
                  if activeLock and activeLock.token == token then
                      invokeLocks[remote] = nil
                  end

                  invokeCooldowns[remote] = {
                      token = token,
                      untilAt = os.clock() + 8,
                  }
                  return false, nil
              end''')

          rep('''local function dragItemTo(item, destination)
              if not item or not item.Parent then
                  return false
              end

              -- Drag remotes may be replaced during round transitions. Refresh
              -- stale references immediately instead of waiting for the poller.
              if not isLive(StartDragging) or not isLive(StopDragging) then
                  refreshRemotes()
                  if not isLive(StartDragging) or not isLive(StopDragging) then
                      return false
                  end
              end

              local startRemote = StartDragging
              local stopRemote = StopDragging
              local started = pcall(startRemote.FireServer, startRemote, item)
              if not started then
                  return false
              end

              task.wait(0.02)

              local moved = pcall(function()
                  if item:IsA("Model") then
                      item:PivotTo(destination)
                  elseif item:IsA("BasePart") then
                      item.CFrame = destination
                  end
              end)

              task.wait(0.02)
              pcall(stopRemote.FireServer, stopRemote)

              return moved and item.Parent ~= nil
          end''', '''local dragBusy = false

          local function acquireDragLock(timeoutSeconds)
              local deadline = os.clock() + math.max(0.05, tonumber(timeoutSeconds) or 0.5)
              while state.active and dragBusy and os.clock() < deadline do
                  task.wait()
              end

              if not state.active or dragBusy then
                  return false
              end

              dragBusy = true
              return true
          end

          local function dragItemTo(item, destination)
              if not item or not item.Parent or not state.active then
                  return false
              end

              -- Drag remotes may be replaced during round transitions. Refresh
              -- stale references immediately instead of waiting for the poller.
              if not isLive(StartDragging) or not isLive(StopDragging) then
                  refreshRemotes()
                  if not isLive(StartDragging) or not isLive(StopDragging) then
                      return false
                  end
              end

              if not acquireDragLock(0.6) then
                  return false
              end

              local startRemote = StartDragging
              local stopRemote = StopDragging
              local startedOk, startedResponse = callUtilityRemote(startRemote, 1, item)
              if not startedOk or startedResponse == false then
                  dragBusy = false
                  return false
              end

              task.wait(0.02)

              local moved = pcall(function()
                  if item.Parent and item:IsA("Model") then
                      item:PivotTo(destination)
                  elseif item.Parent and item:IsA("BasePart") then
                      item.CFrame = destination
                  end
              end)

              task.wait(0.02)
              callUtilityRemote(stopRemote, 1)
              dragBusy = false

              return moved and item.Parent ~= nil
          end''')

          rep('''local function consumeFood(item)
              if not item or not item.Parent or not RequestConsumeItem then
                  return false
              end

              local root = getRoot()
              if not root then
                  return false
              end

              -- Bring world food into a normal server-valid range first.
              if item:IsDescendantOf(workspace) then
                  local part = getPart(item)
                  if part and (part.Position - root.Position).Magnitude > 12 then
                      dragItemTo(item, root.CFrame * CFrame.new(0, 1, -3))
                      task.wait(0.06)
                  end
              end

              local before = getRealHunger()
              local consumeRemote = RequestConsumeItem
              local remoteIsEvent = isLive(consumeRemote) and consumeRemote:IsA("RemoteEvent")

              -- Do NOT reparent the live item into TempStorage here. On consumed/destroyed
              -- items that can produce Roblox's "trying to set locked parent!" warning.
              -- A successful FireServer only proves the request was sent, not accepted.
              -- For RemoteEvents require observable consumption before reporting success.
              local success, response = callUtilityRemote(consumeRemote, 1.5, item)

              task.wait(0.12)

              local after = getRealHunger()
              local itemConsumed = not item.Parent
              local hungerIncreased = before ~= nil and after ~= nil and after > before
              local explicitSuccess = not remoteIsEvent and (
                  response == true
                  or (type(response) == "table" and response.Success == true)
              )
              local accepted = success and (explicitSuccess or itemConsumed or hungerIncreased)

              if accepted then
                  return true
              end

              if item and item.Parent then
                  failedFoodUntil[item] = os.clock() + 2
              end

              return false
          end''', '''local function consumeFood(item)
              if not item or not item.Parent or not state.active then
                  return false
              end

              if not isLive(RequestConsumeItem) then
                  refreshRemotes()
                  if not isLive(RequestConsumeItem) then
                      return false
                  end
              end

              local root = getRoot()
              if not root then
                  return false
              end

              -- Bring world food into a normal server-valid range first.
              if item:IsDescendantOf(workspace) then
                  local part = getPart(item)
                  if part and (part.Position - root.Position).Magnitude > 12 then
                      dragItemTo(item, root.CFrame * CFrame.new(0, 1, -3))
                      task.wait(0.06)
                  end
              end

              local before = getRealHunger()
              local consumeRemote = RequestConsumeItem
              local remoteIsEvent = consumeRemote:IsA("RemoteEvent")

              -- A successful FireServer only proves the request was sent, not accepted.
              -- RemoteEvents are verified by an observable item removal or Hunger gain,
              -- with a short replication window for higher-ping/mobile sessions.
              local success, response = callUtilityRemote(consumeRemote, 1.5, item)
              if not success then
                  if item.Parent then
                      failedFoodUntil[item] = os.clock() + 2
                  end
                  return false
              end

              local explicitSuccess = not remoteIsEvent and (
                  response == true
                  or (type(response) == "table" and response.Success == true)
              )
              if explicitSuccess then
                  return true
              end

              local verifyDeadline = os.clock() + (remoteIsEvent and 0.5 or 0.2)
              repeat
                  task.wait(0.05)

                  local after = getRealHunger()
                  local itemConsumed = not item.Parent
                  local hungerIncreased = before ~= nil and after ~= nil and after > before
                  if itemConsumed or hungerIncreased then
                      return true
                  end
              until not state.active or os.clock() >= verifyDeadline

              if item.Parent then
                  failedFoodUntil[item] = os.clock() + 2
              end

              return false
          end''')

          rep('''local function attemptAutoEat()
              if state.eatBusy then''', '''local function attemptAutoEat()
              if not state.active or state.eatBusy then''')

          rep('''        task.defer(function()
                      attemptAutoEat()
                      eatRequested = false
                  end)''', '''        task.defer(function()
                      pcall(attemptAutoEat)
                      eatRequested = false
                  end)''')

          rep('''local function requestHotbarPickup(item)
              if not item or not item.Parent or not RequestHotbarItem then
                  return false
              end

              local success, response = callUtilityRemote(RequestHotbarItem, 1.5, item)

              return success and (
                  response == true
                  or (type(response) == "table" and response.Success == true)
              )
          end''', '''local function requestHotbarPickup(item)
              if not item or not item.Parent then
                  return false
              end

              if not isLive(RequestHotbarItem) then
                  refreshRemotes()
                  if not isLive(RequestHotbarItem) then
                      return false
                  end
              end

              local pickupRemote = RequestHotbarItem
              local success, response = callUtilityRemote(pickupRemote, 1.5, item)

              if pickupRemote:IsA("RemoteEvent") then
                  return success
              end

              return success and (
                  response == true
                  or (type(response) == "table" and response.Success == true)
              )
          end''')

          rep('''    task.spawn(function()
                  dragItemTo(item, root.CFrame * CFrame.new(0, 1, -3))
                  task.wait(0.08)
                  requestHotbarPickup(item)
                  task.wait(0.35)
              end)''', '''    task.spawn(function()
                  if not state.active or not state.autoBestGear or not item.Parent then
                      return
                  end

                  local dragged = dragItemTo(item, root.CFrame * CFrame.new(0, 1, -3))
                  if not dragged or not state.active then
                      return
                  end

                  task.wait(0.08)
                  if state.active and state.autoBestGear and item.Parent then
                      requestHotbarPickup(item)
                  end
              end)''')

          rep('''if not G.SB99_FINAL_HOOK then
              if type(hookmetamethod) == "function"
                  and type(getnamecallmethod) == "function"
                  and type(newcclosure) == "function" then

                  local hookOk = pcall(function()
                      local oldNamecall
                      oldNamecall = hookmetamethod(game, "__namecall", newcclosure(function(self, ...)''', '''if not G.SB99_FINAL_HOOK then
              if type(hookmetamethod) == "function"
                  and type(getnamecallmethod) == "function" then

                  local wrapClosure = type(newcclosure) == "function" and newcclosure or function(callback)
                      return callback
                  end

                  local hookOk = pcall(function()
                      local oldNamecall
                      oldNamecall = hookmetamethod(game, "__namecall", wrapClosure(function(self, ...)''')

          rep('''                        local executorCall = false
                          if type(checkcaller) == "function" then
                              executorCall = checkcaller()
                          end''', '''                        local executorCall = false
                          if type(checkcaller) == "function" then
                              local callerOk, callerResult = pcall(checkcaller)
                              executorCall = callerOk and callerResult == true
                          end''')

          rep('''local function ensureAxeArmed(weapon)
              if not weapon or not weapon.Parent then
                  return
              end

              if not isLive(EquipItemHandle) then
                  refreshRemotes()
                  if not isLive(EquipItemHandle) then
                      return
                  end
              end

              local now = os.clock()
              if weapon == lastArmed and now - lastArmTime < 1 then
                  return
              end

              local worked = pcall(function()
                  EquipItemHandle:FireServer("FireAllClients", weapon)
              end)

              if not worked then
                  pcall(function()
                      EquipItemHandle:FireServer(weapon)
                  end)
              end

              lastArmed = weapon
              lastArmTime = now
          end''', '''local function ensureAxeArmed(weapon)
              if not weapon or not weapon.Parent then
                  return
              end

              if not isLive(EquipItemHandle) then
                  refreshRemotes()
                  if not isLive(EquipItemHandle) then
                      return
                  end
              end

              local now = os.clock()
              if weapon == lastArmed and now - lastArmTime < 1 then
                  return
              end

              local equipRemote = EquipItemHandle
              local worked, response = callUtilityRemote(equipRemote, 0.75, "FireAllClients", weapon)
              local armed = worked and response ~= false

              if not armed then
                  worked, response = callUtilityRemote(equipRemote, 0.75, weapon)
                  armed = worked and response ~= false
              end

              -- Preserve the one-second throttle even if the remote rejects the
              -- request, otherwise every target would immediately retry equip.
              lastArmed = weapon
              lastArmTime = now
          end''')

          rep('''    -- A hung InvokeServer can no longer permanently exhaust the attack pool.
              task.delay(2, releaseInflight)
              task.spawn(function()
                  pcall(remote.InvokeServer, remote, target, weapon, hitId, attackCFrame)
                  releaseInflight()
              end)''', '''    -- Bound both the inflight counter and the suspended coroutine. Executors
              -- that support task.cancel will not accumulate permanently hung invokes.
              local attackThread
              attackThread = task.spawn(function()
                  pcall(remote.InvokeServer, remote, target, weapon, hitId, attackCFrame)
                  releaseInflight()
              end)

              task.delay(2, function()
                  if released then
                      return
                  end
                  if type(task.cancel) == "function" and attackThread then
                      pcall(task.cancel, attackThread)
                  end
                  releaseInflight()
              end)''')

          rep('''local function lockFarmCharacter()
              local humanoid = getHumanoid()
              local root = getRoot()

              if humanoid then
                  if humanoid.WalkSpeed ~= 0 then
                      humanoid.WalkSpeed = 0
                  end
                  if humanoid.AutoRotate then
                      humanoid.AutoRotate = false
                  end

                  if humanoid.UseJumpPower then
                      if humanoid.JumpPower ~= 0 then
                          humanoid.JumpPower = 0
                      end
                  elseif humanoid.JumpHeight ~= 0 then
                      humanoid.JumpHeight = 0
                  end
              end

              if root then
                  if root.AssemblyLinearVelocity.Magnitude > 0.01 then
                      root.AssemblyLinearVelocity = Vector3.zero
                  end
                  if root.AssemblyAngularVelocity.Magnitude > 0.01 then
                      root.AssemblyAngularVelocity = Vector3.zero
                  end
                  if not root.Anchored then
                      root.Anchored = true
                  end
              end
          end''', '''local function lockFarmCharacter()
              local humanoid = getHumanoid()
              local root = getRoot()

              if humanoid and humanoid.Parent then
                  pcall(function()
                      if humanoid.WalkSpeed ~= 0 then
                          humanoid.WalkSpeed = 0
                      end
                      if humanoid.AutoRotate then
                          humanoid.AutoRotate = false
                      end

                      if humanoid.UseJumpPower then
                          if humanoid.JumpPower ~= 0 then
                              humanoid.JumpPower = 0
                          end
                      elseif humanoid.JumpHeight ~= 0 then
                          humanoid.JumpHeight = 0
                      end
                  end)
              end

              if root and root.Parent then
                  pcall(function()
                      if root.AssemblyLinearVelocity.Magnitude > 0.01 then
                          root.AssemblyLinearVelocity = Vector3.zero
                      end
                      if root.AssemblyAngularVelocity.Magnitude > 0.01 then
                          root.AssemblyAngularVelocity = Vector3.zero
                      end
                      if not root.Anchored then
                          root.Anchored = true
                      end
                  end)
              end
          end''')

          rep('''local function moveFarmTo(position, ignoreInterrupts)
              if not state.autoFarm then
                  return false
              end

              local root = getRoot()
              if not root then
                  return false
              end

              lockFarmCharacter()

              local distance = (root.Position - position).Magnitude
              local duration = math.max(0.15, distance / state.patrolSpeed)

              local tween = TweenService:Create(
                  root,
                  TweenInfo.new(duration, Enum.EasingStyle.Linear),
                  { CFrame = CFrame.new(position) }
              )

              G.SB99_ACTIVE_TWEEN = tween
              tween:Play()

              while state.active
                  and state.autoFarm
                  and tween.PlaybackState == Enum.PlaybackState.Playing do

                  if not ignoreInterrupts then
                      if state.emergencyFoodRun or foodServiceDue() or isNight() then
                          tween:Cancel()
                          break
                      end
                  end

                  task.wait(0.1)
              end

              if G.SB99_ACTIVE_TWEEN == tween then
                  G.SB99_ACTIVE_TWEEN = nil
              end

              return tween.PlaybackState == Enum.PlaybackState.Completed
          end''', '''local function moveFarmTo(position, ignoreInterrupts)
              if not state.autoFarm then
                  return false
              end

              local root = getRoot()
              if not root or not root.Parent then
                  return false
              end

              lockFarmCharacter()

              local distance = (root.Position - position).Magnitude
              local duration = math.max(0.15, distance / state.patrolSpeed)
              local created, tween = pcall(
                  TweenService.Create,
                  TweenService,
                  root,
                  TweenInfo.new(duration, Enum.EasingStyle.Linear),
                  { CFrame = CFrame.new(position) }
              )
              if not created or not tween then
                  return false
              end

              G.SB99_ACTIVE_TWEEN = tween
              if not pcall(tween.Play, tween) then
                  if G.SB99_ACTIVE_TWEEN == tween then
                      G.SB99_ACTIVE_TWEEN = nil
                  end
                  return false
              end

              local deadline = os.clock() + duration + 2
              while state.active and state.autoFarm do
                  local stateOk, playbackState = pcall(function()
                      return tween.PlaybackState
                  end)
                  if not stateOk or playbackState ~= Enum.PlaybackState.Playing then
                      break
                  end

                  if not root.Parent or os.clock() >= deadline then
                      pcall(tween.Cancel, tween)
                      break
                  end

                  if not ignoreInterrupts
                      and (state.emergencyFoodRun or foodServiceDue() or isNight()) then
                      pcall(tween.Cancel, tween)
                      break
                  end

                  task.wait(0.1)
              end

              if G.SB99_ACTIVE_TWEEN == tween then
                  G.SB99_ACTIVE_TWEEN = nil
              end

              local stateOk, playbackState = pcall(function()
                  return tween.PlaybackState
              end)
              return stateOk and playbackState == Enum.PlaybackState.Completed
          end''')

          rep('''                if character and (not root or (root.Position - FARM_HOME).Magnitude > 1.5) then
                      character:PivotTo(CFrame.new(FARM_HOME))
                  end''', '''                if character and (not root or (root.Position - FARM_HOME).Magnitude > 1.5) then
                      pcall(character.PivotTo, character, CFrame.new(FARM_HOME))
                  end''')

          rep('''-- Main window dragging.
          local dragging = false
          local dragInput = nil
          local dragStart = nil
          local frameStart = nil

          track(header.InputBegan:Connect(function(input)
              if input.UserInputType == Enum.UserInputType.MouseButton1
                  or input.UserInputType == Enum.UserInputType.Touch then
                  dragging = true
                  dragStart = input.Position
                  frameStart = frame.Position
              end
          end))

          track(header.InputChanged:Connect(function(input)
              if input.UserInputType == Enum.UserInputType.MouseMovement
                  or input.UserInputType == Enum.UserInputType.Touch then
                  dragInput = input
              end
          end))

          track(UserInputService.InputChanged:Connect(function(input)
              if dragging and input == dragInput and dragStart and frameStart then
                  local delta = input.Position - dragStart
                  local desired = Vector2.new(
                      frameStart.X.Offset + delta.X + frameStart.X.Scale * (workspace.CurrentCamera and workspace.CurrentCamera.ViewportSize.X or 0),
                      frameStart.Y.Offset + delta.Y + frameStart.Y.Scale * (workspace.CurrentCamera and workspace.CurrentCamera.ViewportSize.Y or 0)
                  )
                  local clamped = clampToViewport(desired, frame.AbsoluteSize)
                  frame.Position = UDim2.fromOffset(clamped.X, clamped.Y)
              end
          end))

          track(UserInputService.InputEnded:Connect(function(input)
              if input.UserInputType == Enum.UserInputType.MouseButton1
                  or input.UserInputType == Enum.UserInputType.Touch then
                  dragging = false
                  dragInput = nil
                  dragStart = nil
                  frameStart = nil
              end
          end))''', '''-- Main window dragging. Touch input is owned by the finger that started
          -- the drag, so another finger ending cannot cancel an active drag.
          local dragging = false
          local dragInput = nil
          local dragTouch = nil
          local dragStart = nil
          local frameStart = nil

          track(header.InputBegan:Connect(function(input)
              if input.UserInputType == Enum.UserInputType.MouseButton1
                  or input.UserInputType == Enum.UserInputType.Touch then
                  dragging = true
                  dragStart = input.Position
                  frameStart = frame.Position
                  dragTouch = input.UserInputType == Enum.UserInputType.Touch and input or nil
                  if dragTouch then
                      dragInput = input
                  end
              end
          end))

          track(header.InputChanged:Connect(function(input)
              if not dragging then
                  return
              end

              if input.UserInputType == Enum.UserInputType.MouseMovement
                  or (dragTouch and input == dragTouch) then
                  dragInput = input
              end
          end))

          track(UserInputService.InputChanged:Connect(function(input)
              if dragging and input == dragInput and dragStart and frameStart then
                  local delta = input.Position - dragStart
                  local camera = workspace.CurrentCamera
                  local viewport = camera and camera.ViewportSize or Vector2.zero
                  local desired = Vector2.new(
                      frameStart.X.Offset + delta.X + frameStart.X.Scale * viewport.X,
                      frameStart.Y.Offset + delta.Y + frameStart.Y.Scale * viewport.Y
                  )
                  local clamped = clampToViewport(desired, frame.AbsoluteSize)
                  frame.Position = UDim2.fromOffset(clamped.X, clamped.Y)
              end
          end))

          track(UserInputService.InputEnded:Connect(function(input)
              if not dragging then
                  return
              end

              local endedOwner = (dragTouch and input == dragTouch)
                  or (not dragTouch and input.UserInputType == Enum.UserInputType.MouseButton1)
              if endedOwner then
                  dragging = false
                  dragInput = nil
                  dragTouch = nil
                  dragStart = nil
                  frameStart = nil
              end
          end))''')

          rep('''-- SB ball drag + tap to reopen.
          local ballDragging = false
          local ballInput = nil
          local ballInputStart = nil
          local ballPositionStart = nil
          local ballMoved = false

          track(ball.InputBegan:Connect(function(input)
              if input.UserInputType == Enum.UserInputType.MouseButton1
                  or input.UserInputType == Enum.UserInputType.Touch then
                  ballDragging = true
                  ballMoved = false
                  ballInputStart = input.Position
                  ballPositionStart = ball.Position
              end
          end))

          track(ball.InputChanged:Connect(function(input)
              if input.UserInputType == Enum.UserInputType.MouseMovement
                  or input.UserInputType == Enum.UserInputType.Touch then
                  ballInput = input
              end
          end))

          track(UserInputService.InputChanged:Connect(function(input)
              if not ballDragging or input ~= ballInput or not ballInputStart or not ballPositionStart then
                  return
              end

              local delta = input.Position - ballInputStart

              if delta.Magnitude > 6 then
                  ballMoved = true
              end

              local camera = workspace.CurrentCamera
              local viewport = camera and camera.ViewportSize or Vector2.zero
              local desired = Vector2.new(
                  ballPositionStart.X.Offset + delta.X + ballPositionStart.X.Scale * viewport.X,
                  ballPositionStart.Y.Offset + delta.Y + ballPositionStart.Y.Scale * viewport.Y
              )
              local clamped = clampToViewport(desired, ball.AbsoluteSize)
              ball.Position = UDim2.fromOffset(clamped.X, clamped.Y)
          end))

          track(UserInputService.InputEnded:Connect(function(input)
              if not ballDragging then
                  return
              end

              if input.UserInputType == Enum.UserInputType.MouseButton1
                  or input.UserInputType == Enum.UserInputType.Touch then
                  ballDragging = false
                  ballInput = nil

                  if not ballMoved and ball.Visible then
                      restoreUI()
                  end
              end
          end))''', '''-- SB ball drag + tap to reopen. Multi-touch uses the same ownership rule
          -- as the main window so unrelated touches cannot trigger restore.
          local ballDragging = false
          local ballInput = nil
