name: SB99 place-backed repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sb99-place-backed-fix.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch, compile, verify, guarded push
        shell: bash
        run: |
          set -euo pipefail
          TARGET='99 Nights Helper Godmode'
          EXPECTED='2975d6b5ddd01c80589f593aa20d93aa0b2fd21f'

          actual="$(git hash-object "$TARGET")"
          test "$actual" = "$EXPECTED" || { echo "stale target before patch: $actual"; exit 20; }

          python3 .sb99_place_fix.py

          # Keep already-bagged children across retries. Do not unload a partial
          # rescue set, which was causing visible grab/ungrab loops.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('99 Nights Helper Godmode')
          s = p.read_text(encoding='utf-8')

          old = '''        -- Grab any already-streamed child first.\n        storeCurrentlyLoaded()\n\n        -- Then visit each MissingKids position and immediately bag whatever\n'''
          new = '''        -- Grab any already-streamed child first. Children already stored by a\n        -- previous retry remain in ItemBag; never unload a partial rescue set.\n        storeCurrentlyLoaded()\n\n        -- Then visit each MissingKids position and immediately bag whatever\n'''
          if s.count(old) != 1:
              raise SystemExit('child intro anchor mismatch')
          s = s.replace(old, new, 1)

          old = '''            if verifiedChildCount() + (function()\n                local n = 0\n                for _ in pairs(storedNames) do n = n + 1 end\n                return n\n            end)() >= 4 then\n                break\n            end\n'''
          new = '''            if verifiedChildCount() + #getBaggedChildren() >= 4 then\n                break\n            end\n'''
          if s.count(old) != 1:
              raise SystemExit('child count anchor mismatch')
          s = s.replace(old, new, 1)

          old = '''        if next(usedBags) ~= nil or #getBaggedChildren() > 0 then\n            dropChildrenAtCamp(usedBags)\n        end\n\n        task.wait(1)\n        getUnrescuedChildren()\n        success = verifiedChildCount() >= 4\n'''
          new = '''        local alreadyVerified = verifiedChildCount()\n        local baggedCount = #getBaggedChildren()\n        local neededInBag = math.max(0, 4 - alreadyVerified)\n\n        -- The Old Sack has enough room for all four kids. Keep partial progress\n        -- in the sack between attempts; only return to camp once the complete\n        -- remaining set is actually stored.\n        if neededInBag == 0 then\n            success = true\n        elseif baggedCount >= neededInBag then\n            dropChildrenAtCamp(usedBags)\n            local verifyDeadline = os.clock() + 5\n            repeat\n                task.wait(0.2)\n                getUnrescuedChildren()\n                success = verifiedChildCount() >= 4\n            until success or not state.autoFarm or os.clock() >= verifyDeadline\n        else\n            success = false\n        end\n'''
          if s.count(old) != 1:
              raise SystemExit('partial drop anchor mismatch')
          s = s.replace(old, new, 1)

          # Prefer the game's own CanBeBagged interaction after equipping the
          # sack. It runs the exact ItemBag Tool:BagItem flow from the uploaded
          # place, including TempStorage and server-response rollback.
          old = '''    local before = getSackStoredCount(sack)\n    local ok, response = callUtilityRemote(RequestBagStoreItem, 2, sack, child)\n'''
          new = '''    local before = getSackStoredCount(sack)\n    equipOwnedItem(sack)\n\n    local client = getGameClient()\n    local interactionHandler = client and client.InteractionHandler\n    local interactions = interactionHandler and interactionHandler.Interactions\n    if interactions and type(interactions.CanBeBagged) == "function" then\n        pcall(interactions.CanBeBagged, child)\n        local interactionDeadline = os.clock() + 1\n        repeat\n            if childStoredInItemBag(childName) or getSackStoredCount(sack) > before then\n                state.childRescueObserved[childName] = true\n                return true\n            end\n            task.wait(0.06)\n        until not state.active or os.clock() >= interactionDeadline\n        child = reacquireChild(childName) or child\n        if not child or not child.Parent then\n            return childStoredInItemBag(childName)\n        end\n    end\n\n    local ok, response = callUtilityRemote(RequestBagStoreItem, 2, sack, child)\n'''
          if s.count(old) != 1:
              raise SystemExit('CanBeBagged fallback anchor mismatch')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY

          git diff --check

          # Structural regression checks for the place-backed paths.
          grep -q 'EnemyHandler' "$TARGET"
          grep -q 'ApplyLocalDamage' "$TARGET"
          grep -q 'InventoryHandler.RequestEquipItem' "$TARGET"
          grep -q 'RequestScrapItem' "$TARGET"
          grep -q 'GetAttribute("BurnFuel")' "$TARGET"
          grep -q 'remaining <= 1' "$TARGET"
          grep -q 'root.Position.Y < -20' "$TARGET"
          grep -q 'baggedCount >= neededInBag' "$TARGET"
          ! grep -q 'item:GetAttribute("Scrappable") == true' "$TARGET"

          # Build the official Luau compiler from the upstream source.
          git clone --depth 1 https://github.com/luau-lang/luau.git /tmp/luau
          cmake -S /tmp/luau -B /tmp/luau/build -DCMAKE_BUILD_TYPE=Release >/dev/null
          cmake --build /tmp/luau/build --target Luau.Compile -j2 >/dev/null
          /tmp/luau/build/luau-compile "$TARGET" >/dev/null

          # Race guard immediately before writing. No newer main commit or target
          # blob may be overwritten.
          git fetch origin main
          remote_head="$(git rev-parse origin/main)"
          test "$remote_head" = "$GITHUB_SHA" || { echo "main advanced during validation"; exit 21; }
          remote_blob="$(git rev-parse "origin/main:$TARGET")"
          test "$remote_blob" = "$EXPECTED" || { echo "target changed during validation: $remote_blob"; exit 22; }

          rm -f .sb99_place_fix.py .github/workflows/sb99-place-backed-fix.yml
          git add "$TARGET" .sb99_place_fix.py .github/workflows/sb99-place-backed-fix.yml
          git diff --cached --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: align farm combat and rescue with game client'
          git push origin HEAD:main
