name: SB99 final anti-void validation 2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sb99-final-antivoid2.yml"

permissions:
  contents: write

jobs:
  final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Harden anti-void and guarded push
        shell: bash
        env:
          EXPECTED_BLOB: 7bce8ed72d26dff25f2a2e6ca8b4e3d66dca6703
          TARGET: 99 Nights Helper Godmode
        run: |
          set -euo pipefail
          [[ "$(git hash-object "$TARGET")" == "$EXPECTED_BLOB" ]] || exit 42

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("99 Nights Helper Godmode")
          text = path.read_text(encoding="utf-8")

          pivot_pattern = re.compile(r'(?m)^([ \t]*)lastSafeCFrame = character:GetPivot\(\)$')
          def safe_get_pivot(match):
              i = match.group(1)
              return (
                  i + 'local pivotOk, pivot = pcall(character.GetPivot, character)\n'
                  + i + 'if pivotOk then\n'
                  + i + '    lastSafeCFrame = pivot\n'
                  + i + 'end'
              )

          text, pivot_count = pivot_pattern.subn(safe_get_pivot, text)
          if pivot_count != 2:
              raise SystemExit(f"expected two GetPivot safety sites, found {pivot_count}")

          direct_void_pivot = 'character:PivotTo(lastSafeCFrame + Vector3.new(0, 5, 0))'
          protected_void_pivot = 'pcall(character.PivotTo, character, lastSafeCFrame + Vector3.new(0, 5, 0))'
          if text.count(direct_void_pivot) != 1:
              raise SystemExit("safe-position PivotTo anchor mismatch")
          text = text.replace(direct_void_pivot, protected_void_pivot, 1)

          velocity_pattern = re.compile(
              r'(?m)^([ \t]*)if root\.Position\.Y <= destroyY \+ 35 then\n'
              r'\1    root\.AssemblyLinearVelocity = Vector3\.zero\n'
              r'\1    root\.AssemblyAngularVelocity = Vector3\.zero'
          )
          def protect_velocity(match):
              i = match.group(1)
              return (
                  i + 'if root.Position.Y <= destroyY + 35 then\n'
                  + i + '    pcall(function()\n'
                  + i + '        root.AssemblyLinearVelocity = Vector3.zero\n'
                  + i + '        root.AssemblyAngularVelocity = Vector3.zero\n'
                  + i + '    end)'
              )

          text, velocity_count = velocity_pattern.subn(protect_velocity, text, count=1)
          if velocity_count != 1:
              raise SystemExit("anti-void velocity block mismatch")

          path.write_text(text, encoding="utf-8")
          PY

          python3 <<'PY'
          from pathlib import Path
          import re
          s = Path("99 Nights Helper Godmode").read_text(encoding="utf-8")
          if re.search(r'WaitForChild\([^,\n\)]*\)', s):
              raise SystemExit("unbounded WaitForChild found")
          if s.count("local pivotOk, pivot = pcall(character.GetPivot, character)") != 2:
              raise SystemExit("GetPivot safety count mismatch")
          for needle in (
              "pcall(character.PivotTo, character, lastSafeCFrame + Vector3.new(0, 5, 0))",
              "pcall(character.PivotTo, character, CFrame.new(RETURN_POSITION))",
              "local function attackTarget",
              "local function runFoodService",
              "local function moveFarmTo",
              "local dragTouch = nil",
              "local ballTouch = nil",
              "updateButtons()",
          ):
              if needle not in s:
                  raise SystemExit(f"required path missing: {needle}")
          if "lastSafeCFrame = character:GetPivot()" in s:
              raise SystemExit("unprotected GetPivot remains")
          if "character:PivotTo(lastSafeCFrame + Vector3.new(0, 5, 0))" in s:
              raise SystemExit("unprotected anti-void PivotTo remains")
          PY

          git diff --check -- "$TARGET"
          git diff --quiet -- "$TARGET" && exit 46 || true

          curl -fsSL https://api.github.com/repos/luau-lang/luau/releases/latest -o /tmp/luau-release.json
          luau_url="$(jq -r '.assets[] | select(.name == "luau-ubuntu.zip") | .browser_download_url' /tmp/luau-release.json | head -n1)"
          test -n "$luau_url"
          curl -fsSL "$luau_url" -o /tmp/luau.zip
          rm -rf /tmp/luau && mkdir -p /tmp/luau
          unzip -q /tmp/luau.zip -d /tmp/luau
          chmod +x /tmp/luau/luau-compile
          /tmp/luau/luau-compile "$TARGET" >/dev/null

          git fetch origin main
          remote_blob="$(git ls-tree origin/main -- "$TARGET" | awk '{print $3}')"
          [[ "$remote_blob" == "$EXPECTED_BLOB" ]] || { echo "Target changed before write: $remote_blob"; exit 43; }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$TARGET"
          git rm -- \
            .github/workflows/sb99-final-antivoid.yml \
            .github/workflows/sb99-final-antivoid2.yml
          git commit -m "fix: harden anti-void recovery"

          git fetch origin main
          remote_blob="$(git ls-tree origin/main -- "$TARGET" | awk '{print $3}')"
          [[ "$remote_blob" == "$EXPECTED_BLOB" ]] || { echo "Target changed during validation: $remote_blob"; exit 44; }
          git rebase origin/main
          git fetch origin main
          remote_blob="$(git ls-tree origin/main -- "$TARGET" | awk '{print $3}')"
          [[ "$remote_blob" == "$EXPECTED_BLOB" ]] || { echo "Target changed before push: $remote_blob"; exit 45; }
          git push origin HEAD:main
