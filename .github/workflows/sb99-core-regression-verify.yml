name: SB99 core regression verification

on:
  push:
    paths:
      - '.github/workflows/sb99-core-regression-verify.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch compile verify and guarded push
        shell: bash
        run: |
          set -euo pipefail
          TARGET='99 Nights Helper Godmode'
          PATCH='.github/sb99_core_regression_fix.py'
          FLOW='.github/workflows/sb99-core-regression-verify.yml'
          EXPECTED='8a5f9bc0178a4112043d9eabb08df5c8f0dd10d4'

          test "$(git rev-parse HEAD:"$TARGET")" = "$EXPECTED"
          python3 "$PATCH"
          git diff --check -- "$TARGET"

          if grep -nE 'WaitForChild\([^,\)]*\)' "$TARGET"; then
            echo 'unbounded WaitForChild introduced/found'
            exit 1
          fi

          curl -fsSL --retry 3 -o /tmp/luau.zip \
            'https://github.com/luau-lang/luau/releases/download/0.735/luau-ubuntu.zip'
          unzip -q /tmp/luau.zip -d /tmp/luau
          chmod +x /tmp/luau/luau-compile
          /tmp/luau/luau-compile "$TARGET" >/dev/null

          grep -q 'callUtilityRemote(stopRemote, 1, item)' "$TARGET"
          grep -q 'local function makeHitId(weapon, isTree)' "$TARGET"
          grep -q 'state.hitSequence = (tonumber(state.hitSequence) or 0) + 1' "$TARGET"
          grep -q 'local attackCFrame = targetPart and targetPart.CFrame or root.CFrame' "$TARGET"
          grep -q 'resourcePickupRange = 320' "$TARGET"
          grep -q 'state.strongholdAttemptActive = true' "$TARGET"
          grep -q 'return strongholdDoorOpen()' "$TARGET"
          ! grep -q 'return strongholdDoorOpen() or strongholdGateOpen()' "$TARGET"
          ! grep -q 'callUtilityRemote(stopRemote, 1)$' "$TARGET"

          # Refetch main immediately before the write. Only the temporary
          # staging commits may be above EXPECTED; the target blob itself must
          # still be byte-for-byte the reviewed blob.
          git fetch origin main
          test "$(git rev-parse origin/main:"$TARGET")" = "$EXPECTED"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$TARGET"
          rm -f "$PATCH" "$FLOW"
          git add -A
          git diff --cached --check
          git commit -m 'fix: restore farm combat and resource flow'

          git fetch origin main
          test "$(git rev-parse origin/main:"$TARGET")" = "$EXPECTED"
          git merge-base --is-ancestor origin/main HEAD
          git push origin HEAD:main
