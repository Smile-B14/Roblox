name: SB99 final anti-void validation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sb99-final-antivoid.yml"

permissions:
  contents: write

jobs:
  final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Harden anti-void, compile, and guarded push
        shell: bash
        env:
          EXPECTED_BLOB: 7bce8ed72d26dff25f2a2e6ca8b4e3d66dca6703
          TARGET: 99 Nights Helper Godmode
          WORKFLOW: .github/workflows/sb99-final-antivoid.yml
        run: |
          set -euo pipefail
          [[ "$(git hash-object "$TARGET")" == "$EXPECTED_BLOB" ]] || exit 42

          python3 <<'PY'
          from pathlib import Path

          path = Path("99 Nights Helper Godmode")
          text = path.read_text(encoding="utf-8")

          old_initial = '    lastSafeCFrame = character:GetPivot()'
          new_initial = '''    local pivotOk, pivot = pcall(character.GetPivot, character)
              if pivotOk then
                  lastSafeCFrame = pivot
              end'''
          if text.count(old_initial) != 1:
              raise SystemExit("initial safe-pivot anchor mismatch")
          text = text.replace(old_initial, new_initial, 1)

          old_grounded = '''            if humanoid.FloorMaterial ~= Enum.Material.Air
                          and root.Position.Y > destroyY + 80 then
                          lastSafeCFrame = character:GetPivot()
                      end'''
          new_grounded = '''            if humanoid.FloorMaterial ~= Enum.Material.Air
                          and root.Position.Y > destroyY + 80 then
                          local pivotOk, pivot = pcall(character.GetPivot, character)
                          if pivotOk then
                              lastSafeCFrame = pivot
                          end
                      end'''
          if text.count(old_grounded) != 1:
              raise SystemExit("grounded safe-pivot anchor mismatch")
          text = text.replace(old_grounded, new_grounded, 1)

          old_void = '''            if root.Position.Y <= destroyY + 35 then
                          root.AssemblyLinearVelocity = Vector3.zero
                          root.AssemblyAngularVelocity = Vector3.zero

                          if lastSafeCFrame then
                              character:PivotTo(lastSafeCFrame + Vector3.new(0, 5, 0))
                          else
                              pcall(character.PivotTo, character, CFrame.new(RETURN_POSITION))
                          end
                      end'''
          new_void = '''            if root.Position.Y <= destroyY + 35 then
                          pcall(function()
                              root.AssemblyLinearVelocity = Vector3.zero
                              root.AssemblyAngularVelocity = Vector3.zero
                          end)

                          if lastSafeCFrame then
                              pcall(character.PivotTo, character, lastSafeCFrame + Vector3.new(0, 5, 0))
                          else
                              pcall(character.PivotTo, character, CFrame.new(RETURN_POSITION))
                          end
                      end'''
          if text.count(old_void) != 1:
              raise SystemExit("anti-void recovery anchor mismatch")
          text = text.replace(old_void, new_void, 1)

          path.write_text(text, encoding="utf-8")
          PY

          python3 <<'PY'
          from pathlib import Path
          import re
          s = Path("99 Nights Helper Godmode").read_text(encoding="utf-8")
          if re.search(r'WaitForChild\([^,\n\)]*\)', s):
              raise SystemExit("unbounded WaitForChild found")
          for needle in (
              "local pivotOk, pivot = pcall(character.GetPivot, character)",
              "pcall(character.PivotTo, character, lastSafeCFrame + Vector3.new(0, 5, 0))",
              "pcall(character.PivotTo, character, CFrame.new(RETURN_POSITION))",
              "local function attackTarget",
              "local function runFoodService",
              "local function moveFarmTo",
              "local dragTouch = nil",
              "local ballTouch = nil",
              "updateButtons()",
          ):
              if needle not in s:
                  raise SystemExit(f"required path missing: {needle}")
          if 'character:PivotTo(lastSafeCFrame + Vector3.new(0, 5, 0))' in s:
              raise SystemExit("unprotected anti-void PivotTo remains")
          PY

          git diff --check -- "$TARGET"
          git diff --quiet -- "$TARGET" && exit 46 || true

          curl -fsSL https://api.github.com/repos/luau-lang/luau/releases/latest -o /tmp/luau-release.json
          luau_url="$(jq -r '.assets[] | select(.name == "luau-ubuntu.zip") | .browser_download_url' /tmp/luau-release.json | head -n1)"
          test -n "$luau_url"
          curl -fsSL "$luau_url" -o /tmp/luau.zip
          rm -rf /tmp/luau && mkdir -p /tmp/luau
          unzip -q /tmp/luau.zip -d /tmp/luau
          chmod +x /tmp/luau/luau-compile
          /tmp/luau/luau-compile "$TARGET" >/dev/null

          git fetch origin main
          remote_blob="$(git ls-tree origin/main -- "$TARGET" | awk '{print $3}')"
          [[ "$remote_blob" == "$EXPECTED_BLOB" ]] || { echo "Target changed before write: $remote_blob"; exit 43; }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$TARGET"
          git rm -- "$WORKFLOW"
          git commit -m "fix: harden anti-void recovery"

          git fetch origin main
          remote_blob="$(git ls-tree origin/main -- "$TARGET" | awk '{print $3}')"
          [[ "$remote_blob" == "$EXPECTED_BLOB" ]] || { echo "Target changed during validation: $remote_blob"; exit 44; }
          git rebase origin/main
          git fetch origin main
          remote_blob="$(git ls-tree origin/main -- "$TARGET" | awk '{print $3}')"
          [[ "$remote_blob" == "$EXPECTED_BLOB" ]] || { echo "Target changed before push: $remote_blob"; exit 45; }
          git push origin HEAD:main
