name: SB99 integrated camp and godmode update

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch compile verify and guarded push
        shell: bash
        run: |
          set -euo pipefail
          TARGET='99 Nights Helper Godmode'
          EXPECTED='9b6a85c9617e07aa98a72824ddf181e7aea769d3'

          actual="$(git hash-object "$TARGET")"
          test "$actual" = "$EXPECTED" || { echo "stale helper before patch: $actual"; exit 20; }

          python3 .sb99_aug26_integrated.py

          # The helper was already close to Luau's 200-local top-level limit.
          # Move every newly-added helper onto state so this feature pass does
          # not consume permanent registers in the main chunk.
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('99 Nights Helper Godmode')
          s = p.read_text(encoding='utf-8')

          s = s.replace('local function healthIsNaN(value)\n', 'state.healthIsNaN = function(value)\n', 1)
          s = s.replace('local function applyNaNHealthGodmode(humanoid)\n', 'state.applyNaNHealthGodmode = function(humanoid)\n', 1)
          s = s.replace('\nstate.applyNaNHealthGodmode = applyNaNHealthGodmode\n', '\n', 1)
          s = re.sub(r'(?<![A-Za-z0-9_.])healthIsNaN\(', 'state.healthIsNaN(', s)
          s = re.sub(r'(?<![A-Za-z0-9_.])applyNaNHealthGodmode\(', 'state.applyNaNHealthGodmode(', s)

          s = s.replace('local function getNightCampCFrame()\n', 'state.getNightCampCFrame = function()\n', 1)
          s = re.sub(r'(?<![A-Za-z0-9_.])getNightCampCFrame\(', 'state.getNightCampCFrame(', s)

          s = s.replace('local function fastFoodTransport(item, destination)\n', 'state.fastFoodTransport = function(item, destination)\n', 1)
          s = re.sub(r'(?<![A-Za-z0-9_.])fastFoodTransport\(', 'state.fastFoodTransport(', s)

          s = s.replace('local KNOWN_BED_TIERS = {\n', 'state.KNOWN_BED_TIERS = {\n', 1)
          s = s.replace('local KNOWN_BED_OFFSETS = {\n', 'state.KNOWN_BED_OFFSETS = {\n', 1)
          s = re.sub(r'(?<![A-Za-z0-9_.])KNOWN_BED_TIERS', 'state.KNOWN_BED_TIERS', s)
          s = re.sub(r'(?<![A-Za-z0-9_.])KNOWN_BED_OFFSETS', 'state.KNOWN_BED_OFFSETS', s)

          s = s.replace('local function blueprintTierFromGroup(groupKey, blueprint)\n', 'state.blueprintTierFromGroup = function(groupKey, blueprint)\n', 1)
          s = re.sub(r'(?<![A-Za-z0-9_.])blueprintTierFromGroup\(', 'state.blueprintTierFromGroup(', s)

          s = s.replace('local function discoverCampBuildQueue()\n', 'state.discoverCampBuildQueue = function()\n', 1)
          s = re.sub(r'(?<![A-Za-z0-9_.])discoverCampBuildQueue\(', 'state.discoverCampBuildQueue(', s)

          s = s.replace('local function campCraftAccepted(response)\n', 'state.campCraftAccepted = function(response)\n', 1)
          s = re.sub(r'(?<![A-Za-z0-9_.])campCraftAccepted\(', 'state.campCraftAccepted(', s)

          s = s.replace('local function craftCampBlueprint(name)\n', 'state.craftCampBlueprint = function(name)\n', 1)
          s = re.sub(r'(?<![A-Za-z0-9_.])craftCampBlueprint\(', 'state.craftCampBlueprint(', s)

          p.write_text(s, encoding='utf-8')
          PY

          git diff --check

          grep -q 'nanHealthGodmode = true' "$TARGET"
          grep -q 'state.getNightCampCFrame' "$TARGET"
          grep -q 'state.nightCampLock = true' "$TARGET"
          grep -q 'state.fastFoodTransport' "$TARGET"
          grep -q 'state.discoverCampBuildQueue' "$TARGET"
          grep -q 'state.campCraftAccepted' "$TARGET"
          grep -q 'strongholdCounter' "$TARGET"
          grep -q 'NaN Health Godmode' "$TARGET"
          grep -q 'RequestBagDropItem' "$TARGET"
          grep -q 'RequestScrapItem' "$TARGET"
          grep -q 'InteractionHandler' "$TARGET"

          curl -fsSL -o /tmp/luau.zip \
            https://github.com/luau-lang/luau/releases/download/0.735/luau-ubuntu.zip
          mkdir -p /tmp/luau-bin
          unzip -q /tmp/luau.zip -d /tmp/luau-bin
          LUAU_COMPILE="$(find /tmp/luau-bin -type f -name 'luau-compile' | head -1)"
          test -n "$LUAU_COMPILE"
          chmod +x "$LUAU_COMPILE"
          "$LUAU_COMPILE" "$TARGET" >/dev/null

          # Race guard immediately before the only helper write.
          git fetch origin main
          remote_head="$(git rev-parse origin/main)"
          test "$remote_head" = "$GITHUB_SHA" || { echo "main advanced during validation: $remote_head"; exit 21; }
          remote_blob="$(git rev-parse "origin/main:$TARGET")"
          test "$remote_blob" = "$EXPECTED" || { echo "helper changed during validation: $remote_blob"; exit 22; }

          rm -f .sb99_aug26_integrated.py .github/workflows/sb99-aug26-integrated.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: improve night camp crafting food and godmode'
          git push origin HEAD:main
