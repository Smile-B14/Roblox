name: SB99 diamond hotfix final validation

on:
  push:
    paths:
      - '.github/workflows/sb99-diamond-hotfix-final.yml'

permissions:
  contents: write

jobs:
  final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Hotfix compile verify and guarded push
        shell: bash
        run: |
          set -euo pipefail
          TARGET='99 Nights Helper Godmode'
          PATCH='.github/sb99_diamond_hotfix.py'
          FLOW='.github/workflows/sb99-diamond-hotfix-final.yml'
          EXPECTED='4e2f83a97f56b64a39cc49b90fd5f5d61f048183'

          test "$(git rev-parse HEAD:"$TARGET")" = "$EXPECTED"
          python3 "$PATCH"
          git diff --check -- "$TARGET"

          if grep -nE 'WaitForChild\([^,\)]*\)' "$TARGET"; then
            echo 'unbounded WaitForChild introduced/found'
            exit 1
          fi

          curl -fsSL --retry 3 -o /tmp/luau.zip \
            'https://github.com/luau-lang/luau/releases/download/0.735/luau-ubuntu.zip'
          unzip -q /tmp/luau.zip -d /tmp/luau
          chmod +x /tmp/luau/luau-compile
          /tmp/luau/luau-compile "$TARGET" >/dev/null

          grep -q 'local baseline = state.strongholdBaseline or currentCount' "$TARGET"
          grep -q 'state.strongholdBaseline = nil' "$TARGET"
          grep -q 'content.AutomaticSize = open and Enum.AutomaticSize.Y or Enum.AutomaticSize.None' "$TARGET"
          grep -q 'not state.foodServiceRunning' "$TARGET"
          grep -q 'not state.childRescueRunning' "$TARGET"

          git fetch origin main
          test "$(git rev-parse origin/main:"$TARGET")" = "$EXPECTED"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$TARGET"
          rm -f "$PATCH" "$FLOW"
          git add -A
          git commit -m 'fix: harden diamond verification ownership'

          git fetch origin main
          test "$(git rev-parse origin/main:"$TARGET")" = "$EXPECTED"
          git push origin HEAD:main
