name: SB99 Polish Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sb99-polish-once.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply reviewed patch
        shell: bash
        env:
          SB99_PATCH_ZLIB_B64: 
        run: |
          python - <<'PY'
          import base64, os, zlib
          patch = zlib.decompress(base64.b64decode(os.environ['SB99_PATCH_ZLIB_B64']))
          open('/tmp/sb99.patch', 'wb').write(patch)
          PY
          git apply --whitespace=nowarn /tmp/sb99.patch

      - name: Validate and commit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('99 Nights Helper Godmode').read_text(encoding='utf-8')
          required = [
              'Smile B - 99 Nights Helper',
              'combatScanInterval = 0.05',
              'StopDragging:FireServer()',
              'local function clampToViewport',
              'Godmode Active',
          ]
          for token in required:
              if token not in s:
                  raise SystemExit('validation failed: ' + token)
          if 'local function task.defer' in s:
              raise SystemExit('syntax regression detected')
          PY
          git config user.name 'Smile B Helper Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- '99 Nights Helper Godmode'
          git commit -m 'Polish helper stability, performance and UI'
          git push origin HEAD:main
