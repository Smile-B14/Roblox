name: SB99 one-shot polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sb99-polish-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify source and write improved helper
        shell: bash
        env:
          EXPECTED_BLOB: fa6d67a414f4cf0f9d0aab845b275616563451d3
          EXPECTED_SHA256: 349780f59055c6fe31b5168c9667b7ffd356d0aa496bc177f130ee93e2b59454
          PAYLOAD: 
        run: |
          set -euo pipefail
          current="$(git hash-object '99 Nights Helper Godmode')"
          if [ "$current" != "$EXPECTED_BLOB" ]; then
            echo "Source changed; refusing to overwrite newer content."
            exit 1
          fi
          python - <<'PY'
          import os, base64, gzip, hashlib
          from pathlib import Path
          data = gzip.decompress(base64.b64decode(os.environ['PAYLOAD']))
          if hashlib.sha256(data).hexdigest() != os.environ['EXPECTED_SHA256']:
              raise SystemExit('payload checksum mismatch')
          Path('99 Nights Helper Godmode').write_bytes(data)
          PY
      - name: Commit polished helper and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Smile B Automation'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/sb99-polish-once.yml
          git add '99 Nights Helper Godmode'
          git diff --cached --quiet && exit 0
          git commit -m 'Polish helper stability responsiveness and performance'
          git push origin HEAD:main
