name: SB99 bed and night repair

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: sb99-bed-night-repair
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Guard and patch helper
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BLOB="1fd5e63793b0ae7c9657a2aae7abe079f725e18a"
          ACTUAL_BLOB="$(git hash-object '99 Nights Helper Godmode')"
          if [ "$ACTUAL_BLOB" != "$EXPECTED_BLOB" ]; then
            echo "Refusing stale patch: expected $EXPECTED_BLOB, got $ACTUAL_BLOB" >&2
            exit 20
          fi

          python3 - <<'PY'
          from pathlib import Path

          path = Path("99 Nights Helper Godmode")
          text = path.read_text()

          def replace_once(old: str, new: str, label: str):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              text = text.replace(old, new, 1)

          replace_once(
          '''    fullbright = true,
              nanHealthGodmode = true,
              nightCampLock = false,
          ''',
          '''    fullbright = true,
              nanHealthGodmode = true,
              nightCampLock = false,
              nightClockSeenDay = false,
              nightClockFallback = false,
              nightClockCandidateSince = nil,
          ''',
          "night state fields")

          replace_once(
          '''local function isNight()
              local sources = {}
              local map = workspace:FindFirstChild("Map")
              local campground = map and map:FindFirstChild("Campground")
              table.insert(sources, workspace)
              if map then table.insert(sources, map) end
              if campground then table.insert(sources, campground) end
              table.insert(sources, Lighting)

              local boolNames = {
                  "IsNight", "Night", "Nighttime", "IsNightTime", "NightActive", "NightStarted",
              }
              for _, object in ipairs(sources) do
                  for _, name in ipairs(boolNames) do
                      local ok, value = pcall(object.GetAttribute, object, name)
                      if ok then
                          if type(value) == "boolean" then
                              return value
                          elseif type(value) == "number" and (value == 0 or value == 1) then
                              return value == 1
                          elseif type(value) == "string" then
                              local text = string.lower(value)
                              if text == "true" or text == "night" then return true end
                              if text == "false" or text == "day" then return false end
                          end
                      end
                  end
              end

              local phaseNames = { "Phase", "Cycle", "TimeOfDay", "DayNightState", "WorldPhase" }
              for _, object in ipairs(sources) do
                  for _, name in ipairs(phaseNames) do
                      local ok, value = pcall(object.GetAttribute, object, name)
                      if ok and type(value) == "string" then
                          local text = string.lower(value)
                          if string.find(text, "night", 1, true) then return true end
                          if string.find(text, "day", 1, true)
                              or string.find(text, "dawn", 1, true)
                              or string.find(text, "morning", 1, true) then
                              return false
                          end
                      end
                  end
              end

              -- Unknown phase is treated as daytime. The game's custom lighting can use
              -- a nighttime ClockTime while the actual gameplay phase is visibly day.
              return false
          end
          ''',
          '''local function normalizeNightValue(value, invert)
              local result = nil
              if type(value) == "boolean" then
                  result = value
              elseif type(value) == "number" and (value == 0 or value == 1) then
                  result = value == 1
              elseif type(value) == "string" then
                  local text = string.lower(value)
                  if text == "true" or text == "1" or text == "night" or text == "nighttime" then
                      result = true
                  elseif text == "false" or text == "0" or text == "day" or text == "daytime" then
                      result = false
                  end
              end
              if result ~= nil and invert then
                  result = not result
              end
              return result
          end

          local function isNight()
              local sources = {}
              local map = workspace:FindFirstChild("Map")
              local campground = map and map:FindFirstChild("Campground")
              table.insert(sources, workspace)
              if map then table.insert(sources, map) end
              if campground then table.insert(sources, campground) end
              table.insert(sources, Lighting)

              -- Prefer replicated gameplay state whenever the current game build exposes it.
              local boolSignals = {
                  { "IsNight", false }, { "Night", false }, { "Nighttime", false },
                  { "IsNightTime", false }, { "NightActive", false }, { "NightStarted", false },
                  { "IsDay", true }, { "Daytime", true }, { "IsDayTime", true }, { "DayActive", true },
              }
              for _, object in ipairs(sources) do
                  for _, signal in ipairs(boolSignals) do
                      local name, invert = signal[1], signal[2]
                      local ok, value = pcall(object.GetAttribute, object, name)
                      local result = ok and normalizeNightValue(value, invert) or nil
                      if result ~= nil then
                          if result == false then
                              state.nightClockSeenDay = true
                              state.nightClockFallback = false
                              state.nightClockCandidateSince = nil
                          end
                          return result
                      end

                      local child = object:FindFirstChild(name)
                      if child and (child:IsA("BoolValue") or child:IsA("IntValue")
                          or child:IsA("NumberValue") or child:IsA("StringValue")) then
                          local valueOk, childValue = pcall(function() return child.Value end)
                          result = valueOk and normalizeNightValue(childValue, invert) or nil
                          if result ~= nil then
                              if result == false then
                                  state.nightClockSeenDay = true
                                  state.nightClockFallback = false
                                  state.nightClockCandidateSince = nil
                              end
                              return result
                          end
                      end
                  end
              end

              local phaseNames = {
                  "Phase", "CurrentPhase", "GamePhase", "Cycle", "CycleState", "TimeOfDay",
                  "TimeState", "DayNightState", "DayNightCycle", "WorldPhase",
              }
              for _, object in ipairs(sources) do
                  for _, name in ipairs(phaseNames) do
                      local ok, value = pcall(object.GetAttribute, object, name)
                      if ok and type(value) == "string" then
                          local phase = string.lower(value)
                          if string.find(phase, "night", 1, true) then return true end
                          if string.find(phase, "day", 1, true)
                              or string.find(phase, "dawn", 1, true)
                              or string.find(phase, "morning", 1, true) then
                              state.nightClockSeenDay = true
                              state.nightClockFallback = false
                              state.nightClockCandidateSince = nil
                              return false
                          end
                      end

                      local child = object:FindFirstChild(name)
                      if child and child:IsA("StringValue") then
                          local phase = string.lower(child.Value)
                          if string.find(phase, "night", 1, true) then return true end
                          if string.find(phase, "day", 1, true)
                              or string.find(phase, "dawn", 1, true)
                              or string.find(phase, "morning", 1, true) then
                              state.nightClockSeenDay = true
                              state.nightClockFallback = false
                              state.nightClockCandidateSince = nil
                              return false
                          end
                      end
                  end
              end

              -- ClockTime is only a fallback after this execution has observed a real
              -- daytime clock window. That prevents the old startup bug where a server
              -- could replicate a night-looking ClockTime during visible Day 1, while
              -- still allowing the normal day -> night transition to shelter correctly.
              local clock = tonumber(Lighting.ClockTime)
              if clock ~= nil then
                  local dayClock = clock >= 6.25 and clock < 17.75
                  local nightClock = clock >= 18.25 or clock < 5.75
                  local now = os.clock()

                  if dayClock then
                      state.nightClockSeenDay = true
                      state.nightClockFallback = false
                      state.nightClockCandidateSince = nil
                  elseif nightClock and state.nightClockSeenDay then
                      if state.nightClockCandidateSince == nil then
                          state.nightClockCandidateSince = now
                      elseif now - state.nightClockCandidateSince >= 0.65 then
                          state.nightClockFallback = true
                      end
                  else
                      state.nightClockCandidateSince = nil
                  end
              end

              return state.nightClockFallback == true
          end
          ''',
          "night detection")

          replace_once(
          '''state.getNightCampCFrame = function()
              local fire = getMainFire()
              if fire then
                  local center = fire:FindFirstChild("Center", true)
                      or fire:FindFirstChild("InnerTouchZone", true)
                      or getPart(fire)
                  if center and center:IsA("BasePart") then
                      local standY = center.Position.Y + math.max(2.8, center.Size.Y * 0.5 + 2.5)
                      return CFrame.new(center.Position.X, standY, center.Position.Z)
                  end
              end
              return CFrame.new(CAMPFIRE_DROP + Vector3.new(0, 3, 0))
          end
          ''',
          '''state.getNightCampCFrame = function()
              local fire = getMainFire()
              if fire then
                  local center = fire:FindFirstChild("Center", true)
                      or fire:FindFirstChild("InnerTouchZone", true)
                      or getPart(fire)
                  if center and center:IsA("BasePart") then
                      -- Hide directly below the campfire, matching the stable under-map
                      -- shelter used by current public farms. The farm lock anchors here.
                      return center.CFrame * CFrame.new(0, -40, 0)
                  end
              end
              return CFrame.new(FARM_HOME)
          end
          ''',
          "night shelter cframe")

          replace_once(
          '''    ["washing machine"] = true,
              ["cultist experiment"] = true,
          ''',
          '''    ["washing machine"] = true,
              ["cultist gem"] = true,
              ["cultist experiment"] = true,
          ''',
          "cultist gem scrap name")

          replace_once(
          '''local function lowerName(item)
              return item and string.lower(item.Name) or ""
          end

          local function isLogResource(item)
          ''',
          '''local function lowerName(item)
              return item and string.lower(item.Name) or ""
          end

          local function isCultistGemResource(item)
              local name = lowerName(item)
              return string.find(name, "cultist", 1, true) ~= nil
                  and string.find(name, "gem", 1, true) ~= nil
          end

          local function isLogResource(item)
          ''',
          "cultist gem helper")

          replace_once(
          '''    local name = lowerName(item)
              for _, pattern in ipairs(PROTECTED_RESOURCE_PATTERNS) do
          ''',
          '''    if isCultistGemResource(item) then
                  return false
              end

              local name = lowerName(item)
              for _, pattern in ipairs(PROTECTED_RESOURCE_PATTERNS) do
          ''',
          "cultist gem protected exception")

          replace_once(
          '''local function isScrapResource(item)
              if not item or isProtectedResourceItem(item) then
                  return false
              end

              -- Current game marks generic craft/scrap objects directly. Scrappable is
          ''',
          '''local function isScrapResource(item)
              if not item or isProtectedResourceItem(item) then
                  return false
              end
              if isCultistGemResource(item) then
                  return true
              end

              -- Current game marks generic craft/scrap objects directly. Scrappable is
          ''',
          "cultist gem scrappable")

          replace_once(
          '''local function findOwnedNamedItem(itemName)
              for _, container in ipairs(ownedContainers()) do
                  local item = container and container:FindFirstChild(itemName)
                  if item then
                      return item
                  end
              end
              return nil
          end
          ''',
          '''local function findOwnedNamedItem(itemName)
              for _, container in ipairs(ownedContainers()) do
                  local item = container and container:FindFirstChild(itemName, true)
                  if item then
                      return item
                  end
              end
              return nil
          end
          ''',
          "owned structure lookup")

          replace_once(
          '''local function getGroundPositionAroundCamp(offset)
              local firePart = getPart(getMainFire())
              local center = firePart and firePart.Position or Vector3.new(0, 10, 0)
              local x = center.X + offset.X
              local z = center.Z + offset.Z
              local params = RaycastParams.new()
              params.FilterType = Enum.RaycastFilterType.Exclude
              local character = getCharacter()
              params.FilterDescendantsInstances = character and { character } or {}
              local hit = workspace:Raycast(
                  Vector3.new(x, center.Y + 120, z),
                  Vector3.new(0, -300, 0),
                  params
              )
              return Vector3.new(x, hit and hit.Position.Y or center.Y, z), center
          end
          ''',
          '''local function getGroundPositionAroundCamp(offset)
              local firePart = getPart(getMainFire())
              local center = firePart and firePart.Position or Vector3.new(0, 10, 0)
              local x = center.X + offset.X
              local z = center.Z + offset.Z
              local map = workspace:FindFirstChild("Map")
              local ground = map and map:FindFirstChild("Ground")
              local params = RaycastParams.new()

              if ground then
                  -- Placement validation cares about the real terrain/ground surface.
                  -- Restricting the raycast prevents existing beds, benches or the fire
                  -- from becoming the accidental Y position for the next structure.
                  params.FilterType = Enum.RaycastFilterType.Include
                  params.FilterDescendantsInstances = { ground }
              else
                  params.FilterType = Enum.RaycastFilterType.Exclude
                  local character = getCharacter()
                  params.FilterDescendantsInstances = character and { character } or {}
              end

              local hit = workspace:Raycast(
                  Vector3.new(x, center.Y + 160, z),
                  Vector3.new(0, -400, 0),
                  params
              )

              local fallbackY = center.Y
              local grass = ground and ground:FindFirstChild("Grass", true)
              if grass and grass:IsA("BasePart") then
                  fallbackY = grass.Position.Y
              end
              return Vector3.new(x, hit and hit.Position.Y or fallbackY, z), center
          end
          ''',
          "ground-only placement")

          replace_once(
          '''local function placeCampStructure(item, offset)
              if not item or not item.Parent then return false end
              if not isLive(RequestPlaceStructure) then refreshRemotes() end
              if not isLive(RequestPlaceStructure) then return false end

              equipOwnedItem(item)
              local base = offset or Vector3.new(35, 0, 0)
              local attempts = {
                  base,
                  base + Vector3.new(5, 0, 0),
                  base + Vector3.new(-5, 0, 0),
                  base + Vector3.new(0, 0, 5),
                  base + Vector3.new(0, 0, -5),
                  Vector3.new(-base.Z, 0, base.X),
                  Vector3.new(base.Z, 0, -base.X),
              }

              for _, tryOffset in ipairs(attempts) do
                  if not item.Parent then return true end
                  local placePos, center = getGroundPositionAroundCamp(tryOffset)
                  placePos += Vector3.new(0, 0.15, 0)
                  local placeCF = CFrame.lookAt(placePos, Vector3.new(center.X, placePos.Y, center.Z))
                  local placement = { Valid = true, CFrame = placeCF, Position = placePos }
                  local ok, response = callUtilityRemote(RequestPlaceStructure, 1.5, item, placement, placeCF)
                  local accepted = ok and response ~= false
                      and not (type(response) == "table" and response.Success == false)
                  if accepted then
                      local deadline = os.clock() + 1.25
                      repeat
                          if not item.Parent or worldHasCampStructure(item.Name) then return true end
                          task.wait(0.08)
                      until os.clock() >= deadline
                  end
                  task.wait(0.08)
              end
              return worldHasCampStructure(item.Name)
          end
          ''',
          '''local function placeCampStructure(item, offset)
              if not item or not item.Parent then return false end
              if not isLive(RequestPlaceStructure) then refreshRemotes() end
              if not isLive(RequestPlaceStructure) then return false end

              -- Do not equip structures before placement. The live RequestPlaceStructure
              -- path accepts the crafted Inventory instance directly; equipping can move
              -- it between containers during the server validation window.
              local base = offset or Vector3.new(35, 0, 0)
              local attempts = {
                  base,
                  base + Vector3.new(6, 0, 0),
                  base + Vector3.new(-6, 0, 0),
                  base + Vector3.new(0, 0, 6),
                  base + Vector3.new(0, 0, -6),
                  Vector3.new(-base.Z, 0, base.X),
                  Vector3.new(base.Z, 0, -base.X),
              }

              for _, tryOffset in ipairs(attempts) do
                  if not item.Parent then return true end
                  local placePos = getGroundPositionAroundCamp(tryOffset)
                  -- Match the game's known-good placement call: an unrotated CFrame
                  -- plus the Valid/CFrame/Position placement table.
                  local placeCF = CFrame.new(placePos)
                  local placement = { Valid = true, CFrame = placeCF, Position = placePos }
                  local ok, response = callUtilityRemote(RequestPlaceStructure, 1.75, item, placement, placeCF)
                  local accepted = ok and response ~= false
                      and not (type(response) == "table" and response.Success == false)
                  if accepted then
                      local deadline = os.clock() + 1.6
                      repeat
                          if not item.Parent or worldHasCampStructure(item.Name) then return true end
                          task.wait(0.08)
                      until os.clock() >= deadline
                  end
                  task.wait(0.10)
              end
              return worldHasCampStructure(item.Name)
          end
          ''',
          "structure placement")

          replace_once(
          '''state.KNOWN_BED_TIERS = {
              ["Old Bed"] = 2,
              ["Regular Bed"] = 3,
              ["Good Bed"] = 4,
              ["Giant Bed"] = 5,
          }
          ''',
          '''state.KNOWN_BED_TIERS = {
              -- Old Bed is available on the default bench. The later beds unlock
              -- immediately after Bench 2/3/4 respectively.
              ["Old Bed"] = 1,
              ["Regular Bed"] = 2,
              ["Good Bed"] = 3,
              ["Giant Bed"] = 4,
          }
          ''',
          "bed tiers")

          replace_once(
          '''                        local required = tier or state.KNOWN_BED_TIERS[name] or 1
          ''',
          '''                        local required = state.KNOWN_BED_TIERS[name] or tier or 1
          ''',
          "canonical bed tier precedence")

          replace_once(
          '''    for tier = 2, maxBench do
              local benchName = "Crafting Bench " .. tostring(tier)
              local wood, scrap = getCraftCost(benchName)
              if wood ~= nil and scrap ~= nil then
                  table.insert(queue, { kind = "bench", name = benchName, benchLevel = tier })
              end
              for _, bed in ipairs(beds) do
          ''',
          '''    for tier = 1, maxBench do
              if tier >= 2 then
                  local benchName = "Crafting Bench " .. tostring(tier)
                  local wood, scrap = getCraftCost(benchName)
                  if wood ~= nil and scrap ~= nil then
                      table.insert(queue, { kind = "bench", name = benchName, benchLevel = tier })
                  end
              end
              for _, bed in ipairs(beds) do
          ''',
          "tier-one bed queue")

          replace_once(
          '''            local woodCost, scrapCost = getCraftCost(spec.name)
              if woodCost == nil or scrapCost == nil then
                  -- A UI-only entry that is not a craftable blueprint must not
                  -- block later real tiers/beds.
                  continue
              end
              local totalWood = tonumber(campground:GetAttribute("TotalWood")) or 0
              local totalScrap = tonumber(campground:GetAttribute("TotalScrap")) or 0
              if totalWood < woodCost or totalScrap < scrapCost then
                  -- Keep scanning: a later zero-cost/owned structure may still be placeable.
                  continue
              end

              if spec.kind == "bench" then
          ''',
          '''            -- A crafted bed must remain placeable even after its purchase has
              -- already consumed the wood/scrap. The old common cost gate skipped the
              -- owned item forever whenever placement did not finish in the same pass.
              local ownedItem = spec.kind == "bed" and findOwnedNamedItem(spec.name) or nil
              local woodCost, scrapCost = getCraftCost(spec.name)
              if not ownedItem and (woodCost == nil or scrapCost == nil) then
                  -- A UI-only entry that is not a craftable blueprint must not
                  -- block later real tiers/beds.
                  continue
              end
              if not ownedItem then
                  local totalWood = tonumber(campground:GetAttribute("TotalWood")) or 0
                  local totalScrap = tonumber(campground:GetAttribute("TotalScrap")) or 0
                  if totalWood < woodCost or totalScrap < scrapCost then
                      -- Keep scanning: a later zero-cost/owned structure may still be placeable.
                      continue
                  end
              end

              if spec.kind == "bench" then
          ''',
          "owned bed cost bypass")

          replace_once(
          '''            else
                  local item = findOwnedNamedItem(spec.name)
                  if not item and state.craftCampBlueprint(spec.name) then
          ''',
          '''            else
                  local item = ownedItem
                  if not item and state.craftCampBlueprint(spec.name) then
          ''',
          "reuse owned bed")

          replace_once(
          '''    if state.strongholdControl then
              state.nightCampLock = false
              state.releaseFarmForStronghold()
          else
              lockFarmCharacter()
          end
          end))
          ''',
          '''    if state.strongholdControl then
              state.nightCampLock = false
              state.releaseFarmForStronghold()
          else
              if state.nightCampLock then
                  local character = getCharacter()
                  local root = getRoot()
                  local hideCF = state.getNightCampCFrame()
                  if character and root and (root.Position - hideCF.Position).Magnitude > 0.75 then
                      cancelFarmTween()
                      pcall(character.PivotTo, character, hideCF)
                  end
              end
              lockFarmCharacter()
          end
          end))
          ''',
          "heartbeat night pin")

          # Static feature guards for the intended repair.
          required_markers = [
              '["Old Bed"] = 1',
              'local ownedItem = spec.kind == "bed" and findOwnedNamedItem(spec.name) or nil',
              'return center.CFrame * CFrame.new(0, -40, 0)',
              'local function isCultistGemResource(item)',
              'state.nightClockSeenDay = true',
              'local placeCF = CFrame.new(placePos)',
          ]
          for marker in required_markers:
              if marker not in text:
                  raise SystemExit(f"missing marker after patch: {marker}")

          path.write_text(text)
          PY

          git diff --check

      - name: Compile with official Luau
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/luau-lang/luau.git /tmp/luau
          cmake -S /tmp/luau -B /tmp/luau/build -DCMAKE_BUILD_TYPE=Release >/dev/null
          cmake --build /tmp/luau/build --target Luau.Compile.CLI -j2 >/dev/null
          /tmp/luau/build/luau-compile '99 Nights Helper Godmode' >/dev/null

      - name: Refetch and push guarded repair
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BLOB="1fd5e63793b0ae7c9657a2aae7abe079f725e18a"
          git fetch origin main
          REMOTE_BLOB="$(git rev-parse 'origin/main:99 Nights Helper Godmode')"
          if [ "$REMOTE_BLOB" != "$EXPECTED_BLOB" ]; then
            echo "Refusing to overwrite newer helper: expected $EXPECTED_BLOB, remote is $REMOTE_BLOB" >&2
            exit 21
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '99 Nights Helper Godmode'
          git commit -m 'fix: place beds and restore night shelter'
          git push origin HEAD:main
