name: SB99 tree fuel eat repair

on:
  push:
    paths:
      - '.github/workflows/sb99-tree-eat-fix.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch compile verify and guarded push
        shell: bash
        run: |
          set -euo pipefail
          TARGET='99 Nights Helper Godmode'
          EXPECTED='60f47e4c95779046dfa27b84ea0c3894748f4fda'

          test "$(git hash-object "$TARGET")" = "$EXPECTED"
          python3 .sb99_tree_eat_fix.py
          git diff --check

          grep -q 'resourcePassLimit = 24' "$TARGET"
          grep -q 'resourcePickupRange = 2000' "$TARGET"
          grep -q 'local function directConsumeRequest' "$TARGET"
          grep -q 'pcall(remote.FireServer, remote, fire, item)' "$TARGET"
          grep -q 'local holdUntil = os.clock() + 5' "$TARGET"
          grep -q 'applyFarmNoclip()' "$TARGET"
          grep -q 'restoreFarmNoclip()' "$TARGET"
          grep -q 'treeVisitCooldown\[bestTree\] = now + 7' "$TARGET"

          if grep -Eq 'WaitForChild\([^,)]*\)' "$TARGET"; then
            echo 'Unbounded WaitForChild detected'
            exit 1
          fi

          git clone --depth 1 https://github.com/luau-lang/luau.git /tmp/luau >/dev/null 2>&1
          cmake -S /tmp/luau -B /tmp/luau/build -DCMAKE_BUILD_TYPE=Release >/dev/null
          cmake --build /tmp/luau/build --target Luau.Compile.CLI -j2 >/dev/null
          /tmp/luau/build/luau-compile "$TARGET" >/dev/null

          # Race guard immediately before writing the helper.
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          REMOTE_BLOB="$(git show origin/main:"$TARGET" | git hash-object --stdin)"
          test "$REMOTE_BLOB" = "$EXPECTED"

          rm -f .sb99_tree_eat_fix.py .github/workflows/sb99-tree-eat-fix.yml
          git add "$TARGET" .sb99_tree_eat_fix.py .github/workflows/sb99-tree-eat-fix.yml
          git diff --cached --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: harden tree fuel and auto eat flow'
          git push origin HEAD:main
