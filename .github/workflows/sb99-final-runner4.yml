name: SB99 final runner 4

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sb99-final-runner4.yml"

permissions:
  contents: write

jobs:
  final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile and guarded-push final helper
        shell: bash
        env:
          EXPECTED_BLOB: fad489d80b4297ae9d4fb0065360cc6391507d45
          TARGET: 99 Nights Helper Godmode
        run: |
          set -euo pipefail

          current_blob="$(git hash-object "$TARGET")"
          if [[ "$current_blob" != "$EXPECTED_BLOB" ]]; then
            echo "Target changed before patch: $current_blob"
            exit 42
          fi

          python3 <<'PY'
          from pathlib import Path
          import re
          import textwrap

          target = Path("99 Nights Helper Godmode")

          # Reuse the already-reviewed comprehensive patch implementation from
          # runner2, which itself applies the original guarded specification and
          # fixes its two YAML-indentation-sensitive anchors semantically.
          runner2 = Path(".github/workflows/sb99-final-runner2.yml").read_text(encoding="utf-8")
          marker = "          python3 <<'PY'\n"
          start = runner2.index(marker) + len(marker)
          end = runner2.index("\n          PY", start)
          reviewed_patch = textwrap.dedent(runner2[start:end])
          exec(compile(reviewed_patch, "<sb99-reviewed-final-patch>", "exec"), {})

          text = target.read_text(encoding="utf-8")

          # Every remaining farm-center character pivot is vulnerable to a
          # character-destroy/respawn race. Protect all of them consistently.
          direct_home = 'character:PivotTo(CFrame.new(FARM_HOME))'
          safe_home = 'pcall(character.PivotTo, character, CFrame.new(FARM_HOME))'
          home_count = text.count(direct_home)
          if home_count != 3:
              raise SystemExit(f"unexpected remaining FARM_HOME PivotTo count={home_count}")
          text = text.replace(direct_home, safe_home)

          # CharacterAdded already wrapped its PivotTo in a pcall(function()).
          # After the global replacement above that becomes a redundant nested
          # pcall; collapse it to one protected call.
          nested_respawn = (
              '        pcall(function()\n'
              '            pcall(character.PivotTo, character, CFrame.new(FARM_HOME))\n'
              '        end)'
          )
          simple_respawn = '        pcall(character.PivotTo, character, CFrame.new(FARM_HOME))'
          if nested_respawn not in text:
              raise SystemExit("respawn PivotTo wrapper anchor missing")
          text = text.replace(nested_respawn, simple_respawn, 1)

          direct_return = 'character:PivotTo(CFrame.new(RETURN_POSITION))'
          safe_return = 'pcall(character.PivotTo, character, CFrame.new(RETURN_POSITION))'
          if text.count(direct_return) != 1:
              raise SystemExit("unexpected RETURN_POSITION PivotTo count")
          text = text.replace(direct_return, safe_return, 1)

          # Re-execution cleanup and disableFarm both release the root. Keep
          # either path from failing if the character disappears mid-property write.
          root_release = (
              '    if root then\n'
              '        root.Anchored = false\n'
              '        root.AssemblyLinearVelocity = Vector3.zero\n'
              '        root.AssemblyAngularVelocity = Vector3.zero\n'
              '    end'
          )
          root_release_safe = (
              '    if root then\n'
              '        pcall(function()\n'
              '            root.Anchored = false\n'
              '            root.AssemblyLinearVelocity = Vector3.zero\n'
              '            root.AssemblyAngularVelocity = Vector3.zero\n'
              '        end)\n'
              '    end'
          )
          root_count = text.count(root_release)
          if root_count != 2:
              raise SystemExit(f"unexpected root-release block count={root_count}")
          text = text.replace(root_release, root_release_safe)

          # A stale Humanoid during disableFarm should never leave cleanup half-run.
          disable_humanoid = (
              '    if humanoid then\n'
              '        humanoid.WalkSpeed = previousFarm.walkSpeed\n'
              '        humanoid.AutoRotate = previousFarm.autoRotate\n'
              '\n'
              '        if humanoid.UseJumpPower then\n'
              '            humanoid.JumpPower = previousFarm.jumpPower\n'
              '        else\n'
              '            humanoid.JumpHeight = previousFarm.jumpHeight\n'
              '        end\n'
              '    end'
          )
          disable_humanoid_safe = (
              '    if humanoid then\n'
              '        pcall(function()\n'
              '            humanoid.WalkSpeed = previousFarm.walkSpeed\n'
              '            humanoid.AutoRotate = previousFarm.autoRotate\n'
              '\n'
              '            if humanoid.UseJumpPower then\n'
              '                humanoid.JumpPower = previousFarm.jumpPower\n'
              '            else\n'
              '                humanoid.JumpHeight = previousFarm.jumpHeight\n'
              '            end\n'
              '        end)\n'
              '    end'
          )
          if text.count(disable_humanoid) != 1:
              raise SystemExit("disableFarm Humanoid restore anchor missing")
          text = text.replace(disable_humanoid, disable_humanoid_safe, 1)

          # Most importantly, old-run restoration happens before the new state/UI
          # is created. Contain any stale-character property exception so the new
          # execution cannot abort during startup cleanup.
          previous_pattern = re.compile(
              r'(?s)if previousWasFarming then\n(.*?)\nend\nG\.SB99_FARM_RESTORE = nil'
          )
          match = previous_pattern.search(text)
          if not match:
              raise SystemExit("previous-farm cleanup block missing")
          body = match.group(1)
          protected = (
              'if previousWasFarming then\n'
              '    pcall(function()\n'
              + textwrap.indent(body, '    ')
              + '\n    end)\n'
              'end\nG.SB99_FARM_RESTORE = nil'
          )
          text, count = previous_pattern.subn(lambda _: protected, text, count=1)
          if count != 1:
              raise SystemExit("previous-farm cleanup protection failed")

          target.write_text(text, encoding="utf-8")
          PY

          python3 <<'PY'
          from pathlib import Path
          import re

          s = Path("99 Nights Helper Godmode").read_text(encoding="utf-8")

          # Startup/yield policy.
          if re.search(r'WaitForChild\([^,\n\)]*\)', s):
              raise SystemExit("unbounded WaitForChild found")

          # Final runtime paths that must exist.
          required = (
              "local G = _G",
              "local ok, env = pcall(getgenv)",
              "previousState.autoFarm = false",
              "previousState.autoChop = false",
              "previousState.killAura = false",
              "previousState.autoBestGear = false",
              "previousState.foodServiceRunning = false",
              "if previousWasFarming then\n    pcall(function()",
              "pcall(task.cancel, invokeThread)",
              "local dragBusy = false",
              "local function acquireDragLock",
              "local verifyDeadline = os.clock() + (remoteIsEvent and 0.5 or 0.2)",
              "local function requestHotbarPickup",
              "local wrapClosure = type(newcclosure) == \"function\"",
              "pcall(checkcaller)",
              "pcall(task.cancel, attackThread)",
              "local function lockFarmCharacter",
              "local deadline = os.clock() + duration + 2",
              "pcall(character.PivotTo, character, CFrame.new(FARM_HOME))",
              "pcall(character.PivotTo, character, CFrame.new(RETURN_POSITION))",
              "local dragTouch = nil",
              "local ballTouch = nil",
              "local function runFoodService",
              "local function enableFarm",
              "local function disableFarm",
              "local function minimizeUI",
              "updateButtons()",
          )
          for needle in required:
              if needle not in s:
                  raise SystemExit(f"required hardened path missing: {needle}")

          # There are four distinct protected farm-center pivots after the patch:
          # food service, enable, respawn recovery, and night-center correction.
          if s.count("pcall(character.PivotTo, character, CFrame.new(FARM_HOME))") != 4:
              raise SystemExit("unexpected protected FARM_HOME PivotTo count")

          forbidden = (
              'local G = (type(getgenv) == "function" and getgenv()) or _G',
              'and type(newcclosure) == "function" then',
              'executorCall = checkcaller()',
              'character:PivotTo(CFrame.new(FARM_HOME))',
              'character:PivotTo(CFrame.new(RETURN_POSITION))',
          )
          for needle in forbidden:
              if needle in s:
                  raise SystemExit(f"legacy fragile path still present: {needle}")
          PY

          git diff --check -- "$TARGET"
          if git diff --quiet -- "$TARGET"; then
            echo "No worthwhile target improvement produced"
            exit 46
          fi

          # Parse/compile with the current official Luau compiler, not a generic
          # Lua parser, because this target uses Luau/Roblox syntax and semantics.
          curl -fsSL https://api.github.com/repos/luau-lang/luau/releases/latest -o /tmp/luau-release.json
          luau_url="$(jq -r '.assets[] | select(.name == "luau-ubuntu.zip") | .browser_download_url' /tmp/luau-release.json | head -n1)"
          test -n "$luau_url"
          curl -fsSL "$luau_url" -o /tmp/luau.zip
          rm -rf /tmp/luau
          mkdir -p /tmp/luau
          unzip -q /tmp/luau.zip -d /tmp/luau
          chmod +x /tmp/luau/luau-compile
          /tmp/luau/luau-compile "$TARGET" >/dev/null

          # User-requested stale-write protection: refetch the exact target from
          # origin immediately before preparing the commit and refuse any mismatch.
          git fetch origin main
          remote_blob="$(git ls-tree origin/main -- "$TARGET" | awk '{print $3}')"
          if [[ "$remote_blob" != "$EXPECTED_BLOB" ]]; then
            echo "Target changed immediately before write: $remote_blob"
            exit 43
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$TARGET"
          git rm -- \
            .github/workflows/sb99-final-guarded.yml \
            .github/workflows/sb99-final-runner.yml \
            .github/workflows/sb99-final-runner2.yml \
            .github/workflows/sb99-final-runner3.yml \
            .github/workflows/sb99-final-runner4.yml
          git commit -m "fix: harden final executor runtime"

          # Rebase unrelated main changes, but only while the target itself is
          # still the exact reviewed blob.
          git fetch origin main
          remote_blob="$(git ls-tree origin/main -- "$TARGET" | awk '{print $3}')"
          if [[ "$remote_blob" != "$EXPECTED_BLOB" ]]; then
            echo "Target changed during final validation: $remote_blob"
            exit 44
          fi
          git rebase origin/main

          # Last target refetch directly before the non-force push. A branch race
          # after this check is still rejected by Git rather than force-overwritten.
          git fetch origin main
          remote_blob="$(git ls-tree origin/main -- "$TARGET" | awk '{print $3}')"
          if [[ "$remote_blob" != "$EXPECTED_BLOB" ]]; then
            echo "Target changed immediately before push: $remote_blob"
            exit 45
          fi
          git push origin HEAD:main
