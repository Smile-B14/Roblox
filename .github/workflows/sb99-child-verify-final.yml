name: SB99 strict child rescue validation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sb99-child-verify-final.yml"

permissions:
  contents: write

jobs:
  final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch strict child verification and guarded push
        shell: bash
        env:
          EXPECTED_BLOB: fa25b99a9403b203ef71c44e6bddd53ef4f0887e
          TARGET: 99 Nights Helper Godmode
          WORKFLOW: .github/workflows/sb99-child-verify-final.yml
        run: |
          set -euo pipefail
          [[ "$(git hash-object "$TARGET")" == "$EXPECTED_BLOB" ]] || { echo "Target changed before patch"; exit 42; }

          python3 <<'PY'
          from pathlib import Path

          path = Path("99 Nights Helper Godmode")
          text = path.read_text(encoding="utf-8")

          def rep(old, new, count=1):
              global text
              found = text.count(old)
              if found < count:
                  raise SystemExit(f"patch anchor missing: wanted {count}, found {found}: {old[:120]!r}")
              text = text.replace(old, new, count)

          rep(
              '''    childRescueRunning = false,
              childRescuePending = false,
              childRescueCompleted = false,
              nextChildRescueAt = 0,''',
              '''    childRescueRunning = false,
              childRescuePending = false,
              childRescueCompleted = false,
              childRescueObserved = {},
              childRescueVerified = {},
              nextChildRescueAt = 0,'''
          )

          rep(
              '''        if child:IsA("Model") and isLostChild(child) then
                      table.insert(children, child)
                  end''',
              '''        if child:IsA("Model") and isLostChild(child) then
                      state.childRescueObserved[child.Name] = true
                      table.insert(children, child)
                  end'''
          )

          rep(
              '''local function getUnrescuedChildren()
              local children = {}
              for _, child in ipairs(getLostChildren()) do
                  if not childIsAtCamp(child) then
                      table.insert(children, child)
                  end
              end
              return children
          end''',
              '''local function getUnrescuedChildren()
              local children = {}
              for _, child in ipairs(getLostChildren()) do
                  if childIsAtCamp(child) then
                      state.childRescueVerified[child.Name] = true
                  else
                      table.insert(children, child)
                  end
              end
              return children
          end

          local function verifiedChildCount()
              local count = 0
              for name in pairs(LOST_CHILD_NAMES) do
                  if state.childRescueVerified[name] == true then
                      count = count + 1
                  end
              end
              return count
          end'''
          )

          rep(
              '''    local itemBag = getItemBag()
              if itemBag then
                  return #itemBag:GetChildren()
              end''',
              '''    local itemBag = getItemBag()
              if itemBag then
                  for _, item in ipairs(itemBag:GetChildren()) do
                      if isLostChild(item) then
                          state.childRescueObserved[item.Name] = true
                      end
                  end
                  return #itemBag:GetChildren()
              end'''
          )

          rep(
              '''            if isLostChild(item) then
                          local wasParent = item.Parent
                          local ok = callUtilityRemote(RequestBagDropItem, 0.75, sack, item)
                          if ok then
                              task.wait(0.08)
                              droppedAny = droppedAny or item.Parent ~= wasParent or childIsAtCamp(item)
                          end
                      end''',
              '''            if isLostChild(item) then
                          state.childRescueObserved[item.Name] = true
                          local wasParent = item.Parent
                          local ok = callUtilityRemote(RequestBagDropItem, 0.75, sack, item)
                          if ok then
                              task.wait(0.12)
                              local movedOutOfBag = item.Parent ~= wasParent
                              local rescuedAtCamp = childIsAtCamp(item)
                              if movedOutOfBag or rescuedAtCamp then
                                  state.childRescueVerified[item.Name] = true
                                  droppedAny = true
                              end
                          end
                      end'''
          )

          rep(
              '''    local children = getUnrescuedChildren()
              if #children == 0 then
                  state.childRescueCompleted = true
                  state.childRescuePending = false
                  return true
              end''',
              '''    local children = getUnrescuedChildren()
              if verifiedChildCount() >= 4 then
                  state.childRescueCompleted = true
                  state.childRescuePending = false
                  return true
              end
              -- Never treat an empty replication snapshot as success. If fewer
              -- than four children have been verified, retry discovery later.
              if #children == 0 then
                  return false
              end'''
          )

          rep(
              '''        local remaining = getUnrescuedChildren()
                  success = sackVerified and #remaining == 0''',
              '''        getUnrescuedChildren() -- refresh Lost/rescue attributes after the drop
                  success = sackVerified and verifiedChildCount() >= 4'''
          )

          rep(
              '''    state.childRescueCompleted = false
              state.nextChildRescueAt = 0''',
              '''    state.childRescueCompleted = false
              state.childRescueObserved = {}
              state.childRescueVerified = {}
              state.nextChildRescueAt = 0'''
          )

          path.write_text(text, encoding="utf-8")
          PY

          python3 <<'PY'
          from pathlib import Path
          import re

          s = Path("99 Nights Helper Godmode").read_text(encoding="utf-8")
          if re.search(r'WaitForChild\([^,\n\)]*\)', s):
              raise SystemExit("unbounded WaitForChild found")

          required = (
              'childRescueObserved = {},',
              'childRescueVerified = {},',
              'local function verifiedChildCount()',
              'state.childRescueVerified[child.Name] = true',
              'state.childRescueVerified[item.Name] = true',
              'if verifiedChildCount() >= 4 then',
              'success = sackVerified and verifiedChildCount() >= 4',
              'if #children == 0 then\n        return false',
              'childRescueMaxAttempts = 5',
              'callUtilityRemote(RequestBagDropItem, 0.75, sack, item)',
          )
          for needle in required:
              if needle not in s:
                  raise SystemExit(f"required strict verification path missing: {needle}")

          if 'if #children == 0 then\n        state.childRescueCompleted = true' in s:
              raise SystemExit("empty child snapshot can still produce false success")
          PY

          git diff --check -- "$TARGET"
          git diff --quiet -- "$TARGET" && { echo "No target change"; exit 46; } || true

          curl -fsSL https://api.github.com/repos/luau-lang/luau/releases/latest -o /tmp/luau-release.json
          luau_url="$(jq -r '.assets[] | select(.name == "luau-ubuntu.zip") | .browser_download_url' /tmp/luau-release.json | head -n1)"
          test -n "$luau_url"
          curl -fsSL "$luau_url" -o /tmp/luau.zip
          rm -rf /tmp/luau && mkdir -p /tmp/luau
          unzip -q /tmp/luau.zip -d /tmp/luau
          chmod +x /tmp/luau/luau-compile
          /tmp/luau/luau-compile "$TARGET" >/dev/null

          git fetch origin main
          remote_blob="$(git ls-tree origin/main -- "$TARGET" | awk '{print $3}')"
          [[ "$remote_blob" == "$EXPECTED_BLOB" ]] || { echo "Target changed before write: $remote_blob"; exit 43; }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$TARGET"
          git rm -- "$WORKFLOW"
          git commit -m "fix: require all four rescued children"

          git fetch origin main
          remote_blob="$(git ls-tree origin/main -- "$TARGET" | awk '{print $3}')"
          [[ "$remote_blob" == "$EXPECTED_BLOB" ]] || { echo "Target changed during validation: $remote_blob"; exit 44; }
          git rebase origin/main
          git fetch origin main
          remote_blob="$(git ls-tree origin/main -- "$TARGET" | awk '{print $3}')"
          [[ "$remote_blob" == "$EXPECTED_BLOB" ]] || { echo "Target changed before push: $remote_blob"; exit 45; }
          git push origin HEAD:main
