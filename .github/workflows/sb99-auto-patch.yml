name: SB99 reliability patch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch helper safely
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("99 Nights Helper Godmode")
          text = path.read_text(encoding="utf-8")

          old_drag = '''local function dragItemTo(item, destination)
    if not item or not item.Parent or not StartDragging or not StopDragging then
        return false
    end

    local started = pcall(function()
        StartDragging:FireServer(item)
    end)
    if not started then
        return false
    end

    task.wait(0.02)

    local moved = pcall(function()
        if item:IsA("Model") then
            item:PivotTo(destination)
        elseif item:IsA("BasePart") then
            item.CFrame = destination
        end
    end)

    task.wait(0.02)
    pcall(function()
        StopDragging:FireServer()
    end)

    return moved and item.Parent ~= nil
end'''

          new_drag = '''local function dragItemTo(item, destination)
    if not item or not item.Parent then
        return false
    end

    -- Drag remotes can be replaced during round transitions. Resolve stale
    -- references on demand instead of waiting for the background refresh.
    if not isLive(StartDragging) or not isLive(StopDragging) then
        refreshRemotes()
        if not isLive(StartDragging) or not isLive(StopDragging) then
            return false
        end
    end

    local startRemote = StartDragging
    local stopRemote = StopDragging
    local started = pcall(startRemote.FireServer, startRemote, item)
    if not started then
        return false
    end

    task.wait(0.02)

    local moved = pcall(function()
        if item:IsA("Model") then
            item:PivotTo(destination)
        elseif item:IsA("BasePart") then
            item.CFrame = destination
        end
    end)

    task.wait(0.02)
    pcall(stopRemote.FireServer, stopRemote)

    return moved and item.Parent ~= nil
end'''

          old_consume = '''    local before = getRealHunger()

    -- Do NOT reparent the live item into TempStorage here. On consumed/destroyed
    -- items that can produce Roblox's "trying to set locked parent!" warning.
    -- The current server accepts nearby items through RequestConsumeItem directly.
    local success, response = callUtilityRemote(RequestConsumeItem, 1.5, item)

    task.wait(0.10)

    local after = getRealHunger()
    local accepted = success and (
        response == true
        or (type(response) == "table" and response.Success == true)
        or (before ~= nil and after ~= nil and after > before)
    )'''

          new_consume = '''    local before = getRealHunger()
    local consumeRemote = RequestConsumeItem
    local remoteIsEvent = isLive(consumeRemote) and consumeRemote:IsA("RemoteEvent")

    -- Do NOT reparent the live item into TempStorage here. On consumed/destroyed
    -- items that can produce Roblox's "trying to set locked parent!" warning.
    -- For RemoteEvents, FireServer succeeding only means the request was sent;
    -- it does not prove the server accepted the food. Require an observable
    -- hunger increase or the consumed item disappearing before reporting success.
    local success, response = callUtilityRemote(consumeRemote, 1.5, item)

    task.wait(0.12)

    local after = getRealHunger()
    local itemConsumed = not item.Parent
    local hungerIncreased = before ~= nil and after ~= nil and after > before
    local explicitSuccess = not remoteIsEvent and (
        response == true
        or (type(response) == "table" and response.Success == true)
    )
    local accepted = success and (explicitSuccess or itemConsumed or hungerIncreased)'''

          if text.count(old_drag) != 1:
              raise SystemExit("dragItemTo source block changed; refusing unsafe patch")
          if text.count(old_consume) != 1:
              raise SystemExit("consumeFood source block changed; refusing unsafe patch")

          text = text.replace(old_drag, new_drag, 1)
          text = text.replace(old_consume, new_consume, 1)

          for marker in (
              "Smile B - 99 Nights Helper",
              "local function attemptAutoEat()",
              "local function attackTarget(target, isTree)",
              "local function runFoodService()",
              "local function enableFarm()",
              "local function disableFarm()",
              "Godmode Active",
              "Credits: Smile B",
          ):
              if marker not in text:
                  raise SystemExit("required section missing: " + marker)

          if re.search(r'WaitForChild\(\s*["\'][^"\']+["\']\s*\)', text):
              raise SystemExit("unbounded WaitForChild found")

          if text.count("local function ") < 20:
              raise SystemExit("unexpected function-count drop")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit update and remove temporary workflow
        shell: bash
        run: |
          git config user.name "Smile B Script Polish"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/sb99-auto-patch.yml
          git add '99 Nights Helper Godmode' .github/workflows/sb99-auto-patch.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: verify remote food consumption"
          git push origin main
