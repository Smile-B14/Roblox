name: SB99 diamond farm final validation

on:
  push:
    paths:
      - '.github/workflows/sb99-diamond-ui-final.yml'

permissions:
  contents: write

jobs:
  final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch compile verify and guarded push
        shell: bash
        run: |
          set -euo pipefail
          TARGET='99 Nights Helper Godmode'
          PATCH='.github/sb99_diamond_ui_patch.py'
          FLOW='.github/workflows/sb99-diamond-ui-final.yml'
          EXPECTED='cbf517675468271cb87a1a77f5e454d747ac473c'

          BASE_BLOB="$(git rev-parse HEAD:"$TARGET")"
          test "$BASE_BLOB" = "$EXPECTED"

          python3 "$PATCH"

          # Keep the main Luau chunk below the VM's 200-local register limit.
          # Stronghold helpers stay private to one lexical block and expose only
          # the two callbacks later code/UI need through state.
          python3 <<'PY'
          from pathlib import Path
          p = Path('99 Nights Helper Godmode')
          s = p.read_text(encoding='utf-8')

          strong_marker = '--==============================================================\n-- STRONGHOLD / VERIFIED DIAMOND FARM\n--=============================================================='
          strong_start = s.index(strong_marker)
          child_anchor = '\nlocal function getLostChildren()'
          strong_end = s.index(child_anchor, strong_start)
          strong = s[strong_start:strong_end]
          strong = 'do\n' + strong + '\nstate.readDiamondCount = getDiamondCount\nstate.releaseFarmForStronghold = releaseFarmForStronghold\nend\n'
          s = s[:strong_start] + strong + s[strong_end:]

          # All references after the private block use the exported callback.
          post_start = strong_start + len(strong)
          head = s[:post_start]
          tail = s[post_start:]
          tail = tail.replace('releaseFarmForStronghold()', 'state.releaseFarmForStronghold()')
          s = head + tail

          # UI is another closure so its many Frames/labels/buttons don't add to
          # the main chunk's local-register pressure.
          ui_marker = '--==============================================================\n-- RESPONSIVE COLLAPSIBLE UI\n--=============================================================='
          ui_start = s.index(ui_marker)
          ui = s[ui_start:]
          ui = ui.replace('local count = getDiamondCount()', 'local count = state.readDiamondCount and state.readDiamondCount() or nil')
          s = s[:ui_start] + 'task.defer(function()\n' + ui + '\nend)\n'

          p.write_text(s, encoding='utf-8')
          PY

          git diff --check -- "$TARGET"

          if grep -nE 'WaitForChild\([^,\)]*\)' "$TARGET"; then
            echo 'unbounded WaitForChild introduced/found'
            exit 1
          fi

          curl -fsSL --retry 3 -o /tmp/luau.zip \
            'https://github.com/luau-lang/luau/releases/download/0.735/luau-ubuntu.zip'
          unzip -q /tmp/luau.zip -d /tmp/luau
          chmod +x /tmp/luau/luau-compile
          /tmp/luau/luau-compile "$TARGET" >/dev/null

          grep -q 'RESPONSIVE COLLAPSIBLE UI' "$TARGET"
          grep -q 'local function runStrongholdCycle()' "$TARGET"
          grep -q 'current > baseline' "$TARGET"
          grep -q 'state.diamondFarm = true' "$TARGET"
          grep -q 'state.strongholdControl then' "$TARGET"
          grep -q 'state.readDiamondCount = getDiamondCount' "$TARGET"
          grep -q 'state.releaseFarmForStronghold = releaseFarmForStronghold' "$TARGET"

          git fetch origin main
          REMOTE_BLOB="$(git rev-parse origin/main:"$TARGET")"
          test "$REMOTE_BLOB" = "$EXPECTED"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$TARGET"
          rm -f "$PATCH" "$FLOW"
          git add -A
          git commit -m 'feat: add verified stronghold diamond farm'

          git fetch origin main
          FINAL_REMOTE_BLOB="$(git rev-parse origin/main:"$TARGET")"
          test "$FINAL_REMOTE_BLOB" = "$EXPECTED"
          git push origin HEAD:main
