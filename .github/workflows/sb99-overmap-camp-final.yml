name: SB99 over-map farm and camp final

on:
  push:
    paths:
      - '.github/workflows/sb99-overmap-camp-final.yml'

permissions:
  contents: write

jobs:
  final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch, compile, and guarded push
        shell: bash
        run: |
          set -euo pipefail
          TARGET='99 Nights Helper Godmode'
          WORKFLOW='.github/workflows/sb99-overmap-camp-final.yml'
          BASE_BLOB="$(git rev-parse HEAD:"$TARGET")"

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('99 Nights Helper Godmode')
          s = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected 1 exact match, got {count}')
              s = s.replace(old, new, 1)

          def sub_once(pattern, repl, label, flags=0):
              global s
              s2, count = re.subn(pattern, repl, s, count=1, flags=flags)
              if count != 1:
                  raise RuntimeError(f'{label}: expected 1 regex match, got {count}')
              s = s2

          replace_once(
              'local Lighting = game:GetService("Lighting")',
              '''local Lighting = game:GetService("Lighting")
local GuiService = game:GetService("GuiService")

-- Hide Roblox's built-in streaming "Gameplay Paused" modal. This does not
-- bypass streaming itself, so long-distance child teleports still wait for
-- the destination to replicate before interacting.
pcall(function()
    GuiService:SetGameplayPausedNotificationEnabled(false)
end)''',
              'GuiService / paused notification'
          )

          replace_once(
              'local RequestBagDropItem = nil',
              '''local RequestBagDropItem = nil
local RequestPlantItem = nil
local CraftItem = nil
local RequestPlaceStructure = nil''',
              'new remotes declarations'
          )

          replace_once(
              '    RequestBagDropItem = findReplicated("RequestBagDropItem")',
              '''    RequestBagDropItem = findReplicated("RequestBagDropItem")
    RequestPlantItem = findReplicated("RequestPlantItem")
    CraftItem = findReplicated("CraftItem")
    RequestPlaceStructure = findReplicated("RequestPlaceStructure")''',
              'new remotes refresh'
          )

          sub_once(
              r'(\s+or name == "RequestBagDropItem") then',
              r'''\1
        or name == "RequestPlantItem"
        or name == "CraftItem"
        or name == "RequestPlaceStructure" then''',
              'remote descendant refresh list'
          )

          replace_once(
              '''local FARM_HOME = Vector3.new(0, -50, 0)
local RETURN_POSITION = Vector3.new(0, 50, 0)
local CAMPFIRE_DROP = Vector3.new(0, 13, 0)
local FOOD_AREA = CAMPFIRE_DROP
local SCRAP_DROP = Vector3.new(20, 13, -5)''',
              '''local FARM_HOME = Vector3.new(0, -50, 0)
local FARM_PATROL_Y = 60
local FARM_PLATFORM_Y = -54
local RETURN_POSITION = Vector3.new(0, 50, 0)
local CAMPFIRE_DROP = Vector3.new(0, 13, 0)
local CHILD_CAMP_DROP = Vector3.new(0, 15, 0)
local FOOD_AREA = CAMPFIRE_DROP
local SCRAP_DROP = Vector3.new(20, 13, -5)''',
              'farm/camp constants'
          )

          replace_once(
              '''    patrolRadius = 700,
    patrolSpeed = 60,
    patrolIndex = 1,

    campfireTargetLevel = 6,''',
              '''    patrolRadius = 700,
    patrolSpeed = 60,
    strongAxePatrolSpeed = 80,
    patrolIndex = 1,

    saplingInterval = 10,
    lastSaplingPlant = 0,
    saplingRotation = 0,
    saplingServiceRunning = false,
    campBuildInterval = 2,
    lastCampBuild = 0,
    campBuildRunning = false,
    campBuildDone = type(G.SB99_CAMP_BUILD_DONE) == "table" and G.SB99_CAMP_BUILD_DONE or {},

    campfireTargetLevel = 6,''',
              'farm automation state'
          )

          replace_once(
              'G.SB99_STATE = state',
              '''G.SB99_STATE = state
G.SB99_CAMP_BUILD_DONE = state.campBuildDone''',
              'persist camp build state'
          )

          replace_once(
              '''    previousState.childRescueRunning = false
    previousState.childRescuePending = false''',
              '''    previousState.childRescueRunning = false
    previousState.childRescuePending = false
    previousState.saplingServiceRunning = false
    previousState.campBuildRunning = false''',
              'previous-run cleanup'
          )

          replace_once(
              '    platform.CFrame = CFrame.new(0, -53, 0)',
              '    platform.CFrame = CFrame.new(0, FARM_PLATFORM_Y, 0)',
              'lower farm platform'
          )

          replace_once(
              '''            math.cos(angle) * radius,
            -50,
            math.sin(angle) * radius''',
              '''            math.cos(angle) * radius,
            FARM_PATROL_Y,
            math.sin(angle) * radius''',
              'above-map patrol Y'
          )

          # Long-distance rescue streaming waits.
          sub_once(
              r'(local function discoverMissingChildren\(\).*?)(task\.wait\(0\.18\))(.*?\nend\n\nlocal function storeChildInSack)',
              lambda m: m.group(1) + 'task.wait(2)' + m.group(3),
              'missing-child streaming wait',
              re.S
          )

          replace_once(
              '''        focusCameraAt(part.Position)
    end

    equipOwnedItem(sack)''',
              '''        focusCameraAt(part.Position)
        task.wait(2)
    end

    equipOwnedItem(sack)''',
              'child model load wait'
          )

          replace_once(
              '''            if storeChildInSack(sack, child) then
                stored = stored + 1
            end
            task.wait(0.08)''',
              '''            if storeChildInSack(sack, child) then
                stored = stored + 1
            end
            -- Give the server one second to settle the sack before moving to
            -- the next streamed child region.
            task.wait(1)''',
              'between-child delay'
          )

          replace_once(
              '        pcall(character.PivotTo, character, CFrame.new(CAMPFIRE_DROP + Vector3.new(0, 3, 4)))',
              '        pcall(character.PivotTo, character, CFrame.new(CHILD_CAMP_DROP))',
              'child camp teleport'
          )
          replace_once(
              '    focusCameraAt(CAMPFIRE_DROP)',
              '    focusCameraAt(CHILD_CAMP_DROP)',
              'child camp camera focus'
          )

          automation_block = r'''
--==============================================================
-- CAMP BUILDING / SAPLING ORBIT
--==============================================================

local function getCampground()
    local map = workspace:FindFirstChild("Map")
    return map and map:FindFirstChild("Campground")
end

local craftingDatabase = nil
local function getCraftingDatabase()
    if type(craftingDatabase) == "table" then
        return craftingDatabase
    end

    local databases = ReplicatedStorage:FindFirstChild("Databases")
    local module = databases and databases:FindFirstChild("CraftingDatabase")
    if module and module:IsA("ModuleScript") then
        local ok, result = pcall(require, module)
        if ok and type(result) == "table" then
            craftingDatabase = result
        end
    end
    return craftingDatabase
end

local function getCraftCost(itemName)
    local database = getCraftingDatabase()
    local blueprints = database and database.PossibleBlueprints
    if type(blueprints) ~= "table" then
        return nil, nil
    end

    for _, group in pairs(blueprints) do
        if type(group) == "table" then
            for _, blueprint in pairs(group) do
                if type(blueprint) == "table" and blueprint.Name == itemName then
                    return tonumber(blueprint.WoodPrice) or 0,
                        tonumber(blueprint.ScrapPrice) or 0
                end
            end
        end
    end
    return nil, nil
end

local function findOwnedNamedItem(itemName)
    for _, container in ipairs(ownedContainers()) do
        local item = container and container:FindFirstChild(itemName)
        if item then
            return item
        end
    end
    return nil
end

local function worldHasCampStructure(itemName)
    local structures = workspace:FindFirstChild("Structures")
    if structures and structures:FindFirstChild(itemName, true) then
        return true
    end

    local campground = getCampground()
    return campground ~= nil and campground:FindFirstChild(itemName, true) ~= nil
end

local function currentCraftingBenchLevel()
    local campground = getCampground()
    local structures = workspace:FindFirstChild("Structures")
    local best = 1

    local function scan(root)
        if not root then
            return
        end
        for _, object in ipairs(root:GetDescendants()) do
            local level = tonumber(string.match(object.Name, "^Crafting Bench (%d+)$"))
            if level then
                best = math.max(best, level)
            end
        end
    end

    scan(campground)
    scan(structures)
    return best
end

local function getCampGroundPosition(offset)
    local firePart = getPart(getMainFire())
    local center = firePart and firePart.Position or Vector3.new(0, 10, 0)
    local x = center.X + offset.X
    local z = center.Z + offset.Z

    local params = RaycastParams.new()
    params.FilterType = Enum.RaycastFilterType.Exclude
    local filters = {}
    local character = getCharacter()
    if character then
        table.insert(filters, character)
    end
    params.FilterDescendantsInstances = filters

    local origin = Vector3.new(x, center.Y + 100, z)
    local hit = workspace:Raycast(origin, Vector3.new(0, -250, 0), params)
    local y = hit and hit.Position.Y or (center.Y - 5)
    return Vector3.new(x, y, z), center
end

local function placeCampStructure(item, offset)
    if not item or not item.Parent then
        return false
    end
    if not isLive(RequestPlaceStructure) then
        refreshRemotes()
    end
    if not isLive(RequestPlaceStructure) then
        return false
    end

    local placePos, center = getCampGroundPosition(offset)
    local lookAt = Vector3.new(center.X, placePos.Y, center.Z)
    local placeCF = CFrame.lookAt(placePos, lookAt)
    local placement = {
        Valid = true,
        CFrame = placeCF,
        Position = placePos,
    }

    local ok, response = callUtilityRemote(
        RequestPlaceStructure,
        2,
        item,
        placement,
        placeCF
    )
    return ok and response ~= false
end

local CAMP_BUILD_QUEUE = {
    { name = "Crafting Bench 2", benchLevel = 2, offset = Vector3.new(20, 0, 14) },
    { name = "Old Bed", offset = Vector3.new(-20, 0, 15) },
    { name = "Regular Bed", offset = Vector3.new(-28, 0, 0) },
    { name = "Crafting Bench 3", benchLevel = 3, offset = Vector3.new(22, 0, 0) },
    { name = "Good Bed", offset = Vector3.new(-20, 0, -15) },
    { name = "Crafting Bench 4", benchLevel = 4, offset = Vector3.new(20, 0, -15) },
    { name = "Giant Bed", offset = Vector3.new(0, 0, 30) },
}

local function markCampBuildDone(itemName)
    state.campBuildDone[itemName] = true
    G.SB99_CAMP_BUILD_DONE = state.campBuildDone
end

local function campBuildIsDone(spec)
    if state.campBuildDone[spec.name] then
        return true
    end
    if spec.benchLevel and currentCraftingBenchLevel() >= spec.benchLevel then
        markCampBuildDone(spec.name)
        return true
    end
    if worldHasCampStructure(spec.name) then
        markCampBuildDone(spec.name)
        return true
    end
    return false
end

local function runCampBuildService()
    if not state.active
        or not state.autoFarm
        or not state.smartResources
        or state.campBuildRunning
        or state.childRescueRunning
        or state.foodServiceRunning
        or state.resourceServiceRunning
        or isNight() then
        return
    end

    local level = getCampfireLevel()
    if level == nil or level < state.campfireTargetLevel then
        return
    end

    local now = os.clock()
    if now - state.lastCampBuild < state.campBuildInterval then
        return
    end
    state.lastCampBuild = now
    state.campBuildRunning = true

    pcall(function()
        local campground = getCampground()
        if not campground then
            return
        end

        for _, spec in ipairs(CAMP_BUILD_QUEUE) do
            if not state.autoFarm then
                break
            end

            if not campBuildIsDone(spec) then
                local item = findOwnedNamedItem(spec.name)

                if not item then
                    local woodCost, scrapCost = getCraftCost(spec.name)
                    if woodCost == nil or scrapCost == nil then
                        return
                    end

                    local totalWood = tonumber(campground:GetAttribute("TotalWood")) or 0
                    local totalScrap = tonumber(campground:GetAttribute("TotalScrap")) or 0
                    if totalWood < woodCost or totalScrap < scrapCost then
                        return
                    end

                    if not isLive(CraftItem) then
                        refreshRemotes()
                    end
                    if not isLive(CraftItem) then
                        return
                    end

                    local crafted, response = callUtilityRemote(CraftItem, 2, spec.name)
                    if not crafted or response == false then
                        return
                    end

                    local deadline = os.clock() + 3
                    repeat
                        task.wait(0.1)
                        if campBuildIsDone(spec) then
                            return
                        end
                        item = findOwnedNamedItem(spec.name)
                    until item or not state.autoFarm or os.clock() >= deadline
                end

                if item and item.Parent then
                    cancelFarmTween()
                    local character = getCharacter()
                    if character then
                        pcall(character.PivotTo, character, CFrame.new(CHILD_CAMP_DROP))
                    end
                    lockFarmCharacter()
                    task.wait(0.25)

                    if placeCampStructure(item, spec.offset) then
                        markCampBuildDone(spec.name)
                    end
                end

                -- Preserve the confirmed upgrade/bed order and process only one
                -- construction step per service pass.
                return
            end
        end
    end)

    state.campBuildRunning = false
end

local function plantAvailableSaplings()
    if not state.active or not state.autoFarm or state.saplingServiceRunning then
        return
    end

    state.saplingServiceRunning = true
    pcall(function()
        if not isLive(RequestPlantItem) then
            refreshRemotes()
        end
        if not isLive(RequestPlantItem) then
            return
        end

        local items = workspace:FindFirstChild("Items")
        if not items then
            return
        end

        local saplings = {}
        for _, item in ipairs(items:GetChildren()) do
            if item.Name == "Sapling" then
                table.insert(saplings, item)
            end
        end

        local count = #saplings
        if count == 0 then
            return
        end

        local baseAngle = state.saplingRotation
        for index, sapling in ipairs(saplings) do
            if not state.autoFarm or not sapling.Parent then
                break
            end

            -- Four circular rings, all strictly inside the requested 100-stud
            -- radius. Rotating each pass avoids repeatedly stacking new trees.
            local ring = (index - 1) % 4
            local radius = 40 + ring * 18 -- 40, 58, 76, 94
            local angle = baseAngle
                + ((index - 1) / math.max(1, count)) * math.pi * 2
                + ring * 0.35
            local offset = Vector3.new(
                math.cos(angle) * radius,
                0,
                math.sin(angle) * radius
            )
            local plantPos = select(1, getCampGroundPosition(offset))
            callUtilityRemote(RequestPlantItem, 1.25, sapling, plantPos)
            task.wait(0.04)
        end

        state.saplingRotation = (baseAngle + math.rad(17)) % (math.pi * 2)
    end)
    state.saplingServiceRunning = false
end

task.spawn(function()
    while state.active do
        if state.autoFarm and state.smartResources then
            runCampBuildService()
        end
        task.wait(1)
    end
end)

task.spawn(function()
    while state.active do
        if state.autoFarm then
            local now = os.clock()
            if now - state.lastSaplingPlant >= state.saplingInterval then
                state.lastSaplingPlant = now
                plantAvailableSaplings()
            end
            task.wait(1)
        else
            task.wait(1.5)
        end
    end
end)

local function getFarmTravelSpeed()
    local axe = bestAxe
    if axe and axe.Parent then
        if axe.Name == "Strong Axe" then
            return state.strongAxePatrolSpeed
        elseif axe.Name == "Chainsaw" then
            return math.max(state.strongAxePatrolSpeed, 90)
        elseif axe.Name == "Good Axe" then
            return math.max(state.patrolSpeed, 70)
        end
    end
    return state.patrolSpeed
end

'''

          replace_once(
              'local function moveFarmTo(position, ignoreInterrupts)',
              automation_block + 'local function moveFarmTo(position, ignoreInterrupts)',
              'camp build / sapling / travel-speed block'
          )

          replace_once(
              '    local duration = math.max(0.15, distance / state.patrolSpeed)',
              '    local duration = math.max(0.15, distance / getFarmTravelSpeed())',
              'dynamic Strong Axe travel speed'
          )

          # Ensure farm enable starts the new periodic services promptly.
          replace_once(
              '''    state.childRescueCompleted = false
    state.nextChildRescueAt = 0

    -- Immediate first food sweep, then every minute.''',
              '''    state.childRescueCompleted = false
    state.nextChildRescueAt = 0
    state.lastSaplingPlant = os.clock() - state.saplingInterval
    state.lastCampBuild = 0

    -- Immediate first food sweep, then every minute.''',
              'farm service reset'
          )

          # Final static feature assertions before writing the patched file.
          required = [
              'FARM_PATROL_Y = 60',
              'FARM_PLATFORM_Y = -54',
              'CHILD_CAMP_DROP = Vector3.new(0, 15, 0)',
              'SetGameplayPausedNotificationEnabled(false)',
              'RequestPlantItem',
              'CraftItem',
              'RequestPlaceStructure',
              'Crafting Bench 4',
              'Giant Bed',
              'strongAxePatrolSpeed = 80',
              'radius = 40 + ring * 18',
          ]
          for token in required:
              if token not in s:
                  raise RuntimeError(f'missing required feature token: {token}')

          # The daytime patrol ring must no longer use the old under-map Y.
          patrol_chunk = re.search(r'local patrolPoints = \{\}(.*?)local function enableFarm', s, re.S)
          if not patrol_chunk or 'FARM_PATROL_Y' not in patrol_chunk.group(1):
              raise RuntimeError('patrol points were not migrated to FARM_PATROL_Y')

          path.write_text(s, encoding='utf-8')
          PY

          git diff --check -- "$TARGET"

          # Official Luau compiler, pinned to the current release verified for this run.
          curl -fsSL 'https://github.com/luau-lang/luau/releases/download/0.735/luau-ubuntu.zip' -o /tmp/luau.zip
          rm -rf /tmp/luau
          mkdir -p /tmp/luau
          unzip -q /tmp/luau.zip -d /tmp/luau
          chmod +x /tmp/luau/* || true
          test -x /tmp/luau/luau-compile
          /tmp/luau/luau-compile "$TARGET" >/dev/null

          # A few structural/risk checks beyond parsing.
          python3 <<'PY'
          from pathlib import Path
          s = Path('99 Nights Helper Godmode').read_text(encoding='utf-8')
          assert s.count('local function runCampBuildService()') == 1
          assert s.count('local function plantAvailableSaplings()') == 1
          assert s.count('local function getFarmTravelSpeed()') == 1
          assert 'CFrame.new(0, -53, 0)' not in s
          assert 'math.cos(angle) * radius,\n            -50,' not in s
          assert 'task.wait(0.08)\n        end\n\n        if stored <= 0' not in s
          assert 'CAMPFIRE_DROP + Vector3.new(0, 3, 4)' not in s
          PY

          # Refetch origin/main immediately before the target write. Abort if the
          # target blob changed since checkout; no force push is ever used.
          git fetch origin main
          REMOTE_BLOB="$(git rev-parse origin/main:"$TARGET")"
          if [ "$REMOTE_BLOB" != "$BASE_BLOB" ]; then
            echo "Target changed upstream: $BASE_BLOB -> $REMOTE_BLOB"
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$TARGET"
          git rm "$WORKFLOW"
          git commit -m 'feat: improve over-map farm and camp automation'
          git push origin HEAD:main
