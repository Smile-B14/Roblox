name: SB99 debug-guided regression fix

on:
  push:
    paths:
      - '.github/workflows/sb99-debug-regression-fix.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch compile verify and guarded push
        shell: bash
        run: |
          set -euo pipefail
          TARGET='99 Nights Helper Godmode'
          EXPECTED='12821f707e547b5b12e8f578da85518af4685d43'

          test "$(git hash-object "$TARGET")" = "$EXPECTED"

          python3 .sb99_debug_regression_fix.py
          git diff --check

          grep -q 'state.lastFoodService = os.clock()' "$TARGET"
          grep -q 'fireDerivedLevel' "$TARGET"
          grep -q 'resourcePassLimit = 12' "$TARGET"
          grep -q 'treePart.Position.Y + 4' "$TARGET"
          grep -q 'maxInflight = 16' "$TARGET"
          grep -q 'Inflight %d' "$TARGET"

          if grep -Eq 'WaitForChild\([^,)]*\)' "$TARGET"; then
            echo 'Unbounded WaitForChild detected'
            exit 1
          fi

          git clone --depth 1 https://github.com/luau-lang/luau.git /tmp/luau >/dev/null 2>&1
          cmake -S /tmp/luau -B /tmp/luau/build -DCMAKE_BUILD_TYPE=Release >/dev/null
          cmake --build /tmp/luau/build --target Luau.Compile.CLI -j2 >/dev/null
          /tmp/luau/build/luau-compile "$TARGET" >/dev/null

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          REMOTE_BLOB="$(git show origin/main:"$TARGET" | git hash-object --stdin)"
          test "$REMOTE_BLOB" = "$EXPECTED"

          rm -f .sb99_debug_regression_fix.py .github/workflows/sb99-debug-regression-fix.yml
          git add "$TARGET" .sb99_debug_regression_fix.py .github/workflows/sb99-debug-regression-fix.yml
          git diff --cached --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: restore daytime farm and resource handling'
          git push origin HEAD:main
