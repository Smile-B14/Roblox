name: SB99 final runner 2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sb99-final-runner2.yml"

permissions:
  contents: write

jobs:
  final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply and validate final helper
        shell: bash
        env:
          EXPECTED_BLOB: fad489d80b4297ae9d4fb0065360cc6391507d45
          TARGET: 99 Nights Helper Godmode
          SPEC: .github/workflows/sb99-final-guarded.yml
          RUNNER1: .github/workflows/sb99-final-runner.yml
          RUNNER2: .github/workflows/sb99-final-runner2.yml
        run: |
          set -euo pipefail

          [[ "$(git hash-object "$TARGET")" == "$EXPECTED_BLOB" ]] || exit 42

          python3 <<'PY'
          from pathlib import Path
          import re
          import textwrap

          target = Path("99 Nights Helper Godmode")
          spec = Path(".github/workflows/sb99-final-guarded.yml").read_text(encoding="utf-8")

          marker = "          python3 <<'PY'\n"
          start = spec.index(marker) + len(marker)
          end = spec.index("\n          PY", start)
          patch_source = textwrap.dedent(spec[start:end])

          # Exclude the two anchors whose indentation was altered by YAML block
          # dedenting. They are applied below with semantic, indentation-aware regex.
          a = patch_source.index("rep('''                        local executorCall = false")
          b = patch_source.index("rep('''local function ensureAxeArmed", a)
          patch_source = patch_source[:a] + patch_source[b:]

          a = patch_source.index("rep('''                if character and (not root or (root.Position - FARM_HOME).Magnitude > 1.5) then")
          b = patch_source.index("rep('''-- Main window dragging.", a)
          patch_source = patch_source[:a] + patch_source[b:]

          exec(compile(patch_source, "<sb99-reviewed-patch>", "exec"), {})

          text = target.read_text(encoding="utf-8")

          checkcaller_pattern = re.compile(
              r'(?m)^([ \t]*)local executorCall = false\n'
              r'\1if type\(checkcaller\) == "function" then\n'
              r'\1    executorCall = checkcaller\(\)\n'
              r'\1end$'
          )
          def harden_checkcaller(match):
              i = match.group(1)
              return (
                  i + 'local executorCall = false\n'
                  + i + 'if type(checkcaller) == "function" then\n'
                  + i + '    local callerOk, callerResult = pcall(checkcaller)\n'
                  + i + '    executorCall = callerOk and callerResult == true\n'
                  + i + 'end'
              )
          text, count = checkcaller_pattern.subn(harden_checkcaller, text, count=1)
          if count != 1:
              raise SystemExit(f"checkcaller semantic anchor count={count}")

          pivot_pattern = re.compile(
              r'(?m)^([ \t]*)if character and \(not root or \(root\.Position - FARM_HOME\)\.Magnitude > 1\.5\) then\n'
              r'\1    character:PivotTo\(CFrame\.new\(FARM_HOME\)\)\n'
              r'\1end$'
          )
          def harden_pivot(match):
              i = match.group(1)
              return (
                  i + 'if character and (not root or (root.Position - FARM_HOME).Magnitude > 1.5) then\n'
                  + i + '    pcall(character.PivotTo, character, CFrame.new(FARM_HOME))\n'
                  + i + 'end'
              )
          text, count = pivot_pattern.subn(harden_pivot, text, count=1)
          if count != 1:
              raise SystemExit(f"night PivotTo semantic anchor count={count}")

          target.write_text(text, encoding="utf-8")
          PY

          python3 <<'PY'
          from pathlib import Path
          import re

          s = Path("99 Nights Helper Godmode").read_text(encoding="utf-8")

          if re.search(r'WaitForChild\([^,\n\)]*\)', s):
              raise SystemExit("unbounded WaitForChild found")

          required = (
              "local function callUtilityRemote",
              "pcall(task.cancel, invokeThread)",
              "local dragBusy = false",
              "local verifyDeadline = os.clock() + (remoteIsEvent and 0.5 or 0.2)",
              "local function requestHotbarPickup",
              "local wrapClosure = type(newcclosure) == \"function\"",
              "pcall(checkcaller)",
              "pcall(task.cancel, attackThread)",
              "local deadline = os.clock() + duration + 2",
              "pcall(character.PivotTo, character, CFrame.new(FARM_HOME))",
              "local dragTouch = nil",
              "local ballTouch = nil",
              "local function runFoodService",
              "local function enableFarm",
              "local function disableFarm",
              "local function minimizeUI",
              "updateButtons()",
          )
          for needle in required:
              if needle not in s:
                  raise SystemExit(f"required hardened path missing: {needle}")

          for needle in (
              'local G = (type(getgenv) == "function" and getgenv()) or _G',
              'and type(newcclosure) == "function" then',
              'executorCall = checkcaller()',
              'character:PivotTo(CFrame.new(FARM_HOME))',
          ):
              if needle in s:
                  raise SystemExit(f"legacy fragile path still present: {needle}")
          PY

          git diff --check -- "$TARGET"
          git diff --quiet -- "$TARGET" && { echo "No meaningful target diff"; exit 46; } || true

          curl -fsSL https://api.github.com/repos/luau-lang/luau/releases/latest -o /tmp/luau-release.json
          luau_url="$(jq -r '.assets[] | select(.name == "luau-ubuntu.zip") | .browser_download_url' /tmp/luau-release.json | head -n1)"
          test -n "$luau_url"
          curl -fsSL "$luau_url" -o /tmp/luau.zip
          rm -rf /tmp/luau && mkdir -p /tmp/luau
          unzip -q /tmp/luau.zip -d /tmp/luau
          chmod +x /tmp/luau/luau-compile
          /tmp/luau/luau-compile "$TARGET" >/dev/null

          # Fresh remote-target check immediately before preparing the write.
          git fetch origin main
          remote_blob="$(git ls-tree origin/main -- "$TARGET" | awk '{print $3}')"
          [[ "$remote_blob" == "$EXPECTED_BLOB" ]] || { echo "Target changed: $remote_blob"; exit 43; }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$TARGET"
          git rm -- "$SPEC" "$RUNNER1" "$RUNNER2"
          git commit -m "fix: harden final executor runtime"

          git fetch origin main
          remote_blob="$(git ls-tree origin/main -- "$TARGET" | awk '{print $3}')"
          [[ "$remote_blob" == "$EXPECTED_BLOB" ]] || { echo "Target changed during validation: $remote_blob"; exit 44; }
          git rebase origin/main

          # Final pre-push refetch. No force push: any later race fails safely.
          git fetch origin main
          remote_blob="$(git ls-tree origin/main -- "$TARGET" | awk '{print $3}')"
          [[ "$remote_blob" == "$EXPECTED_BLOB" ]] || { echo "Target changed before push: $remote_blob"; exit 45; }
          git push origin HEAD:main
