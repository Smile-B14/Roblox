name: SB99 patrol fire repair

on:
  push:
    paths:
      - '.github/workflows/sb99-patrol-fire-repair.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch compile verify and guarded push
        shell: bash
        run: |
          set -euo pipefail

          TARGET='99 Nights Helper Godmode'
          PATCH='.github/sb99-patrol-fire-repair.py'
          WORKFLOW='.github/workflows/sb99-patrol-fire-repair.yml'
          EXPECTED='2b4affd56d426609d6c3b34c4c746b24ced4127d'

          CURRENT="$(git rev-parse "HEAD:${TARGET}")"
          test "$CURRENT" = "$EXPECTED"

          python3 "$PATCH"
          git diff --check

          grep -F 'treeServiceEvery = 4' "$TARGET" >/dev/null
          grep -F 'treeHoldSeconds = 1.6' "$TARGET" >/dev/null
          grep -F 'fuelPriority(item)' "$TARGET" >/dev/null
          grep -F 'fireDerivedLevel = 1' "$TARGET" >/dev/null
          grep -F 'G.SB99_FIRE_DERIVED_LEVEL = nil' "$TARGET" >/dev/null
          ! grep -F 'local holdUntil = os.clock() + 5' "$TARGET" >/dev/null
          ! grep -F 'fireDerivedLevel = math.clamp(tonumber(G.SB99_FIRE_DERIVED_LEVEL)' "$TARGET" >/dev/null

          git clone --depth 1 https://github.com/luau-lang/luau.git /tmp/luau
          cmake -S /tmp/luau -B /tmp/luau/build -DCMAKE_BUILD_TYPE=Release >/dev/null
          cmake --build /tmp/luau/build --target Luau.Compile.CLI -j2 >/dev/null
          /tmp/luau/build/luau-compile "$TARGET" >/dev/null

          # Re-fetch main immediately before writing. Abort if the target blob
          # changed while this validation job was running.
          git fetch origin main
          LATEST="$(git rev-parse "origin/main:${TARGET}")"
          test "$LATEST" = "$EXPECTED"

          rm -f "$PATCH" "$WORKFLOW"
          git add "$TARGET" "$PATCH" "$WORKFLOW"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: restore patrol and campfire fueling'
          git push origin HEAD:main
