name: SB99 final runner 3

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sb99-final-runner3.yml"

permissions:
  contents: write

jobs:
  final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Final patch compile and guarded push
        shell: bash
        env:
          EXPECTED_BLOB: fad489d80b4297ae9d4fb0065360cc6391507d45
          TARGET: 99 Nights Helper Godmode
        run: |
          set -euo pipefail
          [[ "$(git hash-object "$TARGET")" == "$EXPECTED_BLOB" ]] || exit 42

          python3 <<'PY'
          from pathlib import Path
          import textwrap

          target = Path("99 Nights Helper Godmode")
          runner2 = Path(".github/workflows/sb99-final-runner2.yml").read_text(encoding="utf-8")
          marker = "          python3 <<'PY'\n"
          start = runner2.index(marker) + len(marker)
          end = runner2.index("\n          PY", start)
          source = textwrap.dedent(runner2[start:end])
          exec(compile(source, "<sb99-final-patch>", "exec"), {})

          text = target.read_text(encoding="utf-8")
          direct = 'character:PivotTo(CFrame.new(FARM_HOME))'
          replacement = 'pcall(character.PivotTo, character, CFrame.new(FARM_HOME))'
          count = text.count(direct)
          if count != 1:
              raise SystemExit(f"expected one remaining food-service PivotTo, found {count}")
          text = text.replace(direct, replacement, 1)
          target.write_text(text, encoding="utf-8")
          PY

          python3 <<'PY'
          from pathlib import Path
          import re

          s = Path("99 Nights Helper Godmode").read_text(encoding="utf-8")
          if re.search(r'WaitForChild\([^,\n\)]*\)', s):
              raise SystemExit("unbounded WaitForChild found")

          required = (
              "local G = _G",
              "local ok, env = pcall(getgenv)",
              "previousState.foodServiceRunning = false",
              "pcall(task.cancel, invokeThread)",
              "local dragBusy = false",
              "local function acquireDragLock",
              "local verifyDeadline = os.clock() + (remoteIsEvent and 0.5 or 0.2)",
              "local function requestHotbarPickup",
              "local wrapClosure = type(newcclosure) == \"function\"",
              "pcall(checkcaller)",
              "pcall(task.cancel, attackThread)",
              "local deadline = os.clock() + duration + 2",
              "pcall(character.PivotTo, character, CFrame.new(FARM_HOME))",
              "local dragTouch = nil",
              "local ballTouch = nil",
              "local function runFoodService",
              "local function enableFarm",
              "local function disableFarm",
              "local function minimizeUI",
              "updateButtons()",
          )
          for needle in required:
              if needle not in s:
                  raise SystemExit(f"required hardened path missing: {needle}")

          if s.count("pcall(character.PivotTo, character, CFrame.new(FARM_HOME))") != 2:
              raise SystemExit("expected both farm-center PivotTo paths to be protected")

          for needle in (
              'local G = (type(getgenv) == "function" and getgenv()) or _G',
              'and type(newcclosure) == "function" then',
              'executorCall = checkcaller()',
              'character:PivotTo(CFrame.new(FARM_HOME))',
          ):
              if needle in s:
                  raise SystemExit(f"legacy fragile path still present: {needle}")
          PY

          git diff --check -- "$TARGET"
          git diff --quiet -- "$TARGET" && { echo "No target improvement"; exit 46; } || true

          curl -fsSL https://api.github.com/repos/luau-lang/luau/releases/latest -o /tmp/luau-release.json
          luau_url="$(jq -r '.assets[] | select(.name == "luau-ubuntu.zip") | .browser_download_url' /tmp/luau-release.json | head -n1)"
          test -n "$luau_url"
          curl -fsSL "$luau_url" -o /tmp/luau.zip
          rm -rf /tmp/luau && mkdir -p /tmp/luau
          unzip -q /tmp/luau.zip -d /tmp/luau
          chmod +x /tmp/luau/luau-compile
          /tmp/luau/luau-compile "$TARGET" >/dev/null

          # Refetch the current target immediately before preparing the GitHub write.
          git fetch origin main
          remote_blob="$(git ls-tree origin/main -- "$TARGET" | awk '{print $3}')"
          [[ "$remote_blob" == "$EXPECTED_BLOB" ]] || { echo "Target changed before commit: $remote_blob"; exit 43; }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$TARGET"
          git rm -- \
            .github/workflows/sb99-final-guarded.yml \
            .github/workflows/sb99-final-runner.yml \
            .github/workflows/sb99-final-runner2.yml \
            .github/workflows/sb99-final-runner3.yml
          git commit -m "fix: harden final executor runtime"

          git fetch origin main
          remote_blob="$(git ls-tree origin/main -- "$TARGET" | awk '{print $3}')"
          [[ "$remote_blob" == "$EXPECTED_BLOB" ]] || { echo "Target changed during validation: $remote_blob"; exit 44; }
          git rebase origin/main

          # One final remote-target refetch directly before the non-force push.
          git fetch origin main
          remote_blob="$(git ls-tree origin/main -- "$TARGET" | awk '{print $3}')"
          [[ "$remote_blob" == "$EXPECTED_BLOB" ]] || { echo "Target changed immediately before push: $remote_blob"; exit 45; }
          git push origin HEAD:main
